# Mở dev build từ Metro chạy mock, đăng nhập SĐT mẫu (OTP 123456) rồi vào màn Trợ lý AI.
# Biến METRO_URL: URL Metro đã mã hoá, mặc định http%3A%2F%2F127.0.0.1%3A8090.
appId: vn.teamhexa.songheloi
---
- launchApp:
    clearState: true
- openLink: songheloi://expo-development-client/?url=${METRO_URL || 'http%3A%2F%2F127.0.0.1%3A8090'}
# Lần đầu mở sau clearState, expo-dev-client bật dev menu che màn đăng nhập.
- extendedWaitUntil:
    visible:
      id: xmark
    timeout: 60000
    optional: true
- tapOn:
    id: xmark
    optional: true
- extendedWaitUntil:
    visible: Nhập số điện thoại
    timeout: 60000
- tapOn: Nhập số điện thoại
- inputText: '0901234567'
- tapOn: Tiếp tục
- extendedWaitUntil:
    visible: Mã OTP
    timeout: 15000
- tapOn: Mã OTP
# Đủ 6 số thì màn OTP tự xác nhận.
- inputText: '123456'
- extendedWaitUntil:
    visible: Đóng hướng dẫn
    timeout: 20000
- tapOn: Đóng hướng dẫn
- openLink: songheloi://ai
- extendedWaitUntil:
    visible: Tin nhắn cho trợ lý
    timeout: 10000
