*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; background: var(--ground); color: var(--text); font: 14px/20px var(--font); -webkit-font-smoothing: antialiased; }

.num { font-variant-numeric: tabular-nums; }

main { max-width: 1440px; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }

.title { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
h1 { font-size: 24px; line-height: 1.2; font-weight: 600; margin: 0; letter-spacing: -.01em; }
.segmented { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--raised); flex: none; }

.kpi { all: unset; position: relative; cursor: pointer; padding: 14px 20px; }

.kpi span { color: var(--muted); display: flex; align-items: center; gap: 6px; }

.kpi[aria-selected="true"] span { color: var(--text); }
.kpi[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--text); }
.kpi:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

.work { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 16px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; min-width: 0; }

<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const ENV = "production";
const STATUS = { used: "Đang dùng", unused: "Không thấy trong code", missing: "Chỉ ở .env.example", drift: "Không có ở staging", github: "Chỉ trên GitHub" };
// A row shows the status that needs action first; "used" only when nothing else applies.
const RANK = ["missing", "unused", "drift", "github", "used"];
const DOT = { missing: "--negative", unused: "--warning", drift: "--accent", github: "--faint", used: "--control" };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const svcById = Object.fromEntries(DATA.services.map(s => [s.id, s]));
const order = Object.fromEntries(DATA.services.map((s, i) => [s.id, i]));
const label = id => svcById[id]?.label || id;
const byOrder = (a, b) => (order[a] ?? 99) - (order[b] ?? 99);
// Source tags take their own hues so they never read as a status.
const source = r => `<span class="src s-${r.source === "GitHub" ? "gh" : r.source.endsWith(".env.example") ? "ex" : r.source.endsWith("/dev") ? "dev" : "db"}">${esc(r.source)}</span>`;
const peers = r => r.to.filter(t => t !== r.service).map(label);

DATA.rows.forEach((r, i) => { r.i = i; r.main = RANK.find(s => r.status.includes(s)); });
const state = { q: "", status: "", svc: "", key: null, closed: new Set() };

for (const a of document.querySelectorAll(".segmented a")) if (a.getAttribute("href") === ENV + ".html") a.setAttribute("aria-current", "page");

const count = s => DATA.rows.filter(r => r.status.includes(s)).length;
$("foot").textContent = `Sinh lúc ${DATA.generatedAt} từ Dopbase (${DATA.envs.join(", ")}) và nhánh ${DATA.branch}. Trang chỉ chứa tên biến, không chứa giá trị.`;

$("kpis").innerHTML = [["", "Tất cả biến", DATA.rows.length], ...RANK.map(s => [s, STATUS[s], count(s)])].map(([s, t, n]) =>
  `<button type="button" class="kpi" role="tab" data-s="${s}"><span>${s ? `<i class="dot" style="background:var(${DOT[s]})"></i>` : ""}${esc(t)}</span><b class="num">${n}</b></button>`).join("");
for (const b of $("kpis").children) b.onclick = () => { state.status = b.dataset.s; render(); };

const owners = [...new Set(DATA.rows.map(r => r.service))].sort(byOrder);
$("svc").innerHTML = `<option value="">Mọi service</option>` + [...new Set(DATA.rows.flatMap(r => [r.service, ...r.to]))]
  .sort(byOrder).map(s => `<option value="${s}">${esc(label(s))}</option>`).join("");
$("q").oninput = e => { state.q = e.target.value.trim().toLowerCase(); render(); };
$("svc").onchange = e => { state.svc = e.target.value; render(); };

function shown() {
  return DATA.rows.filter(r =>
    (!state.status || r.status.includes(state.status)) &&
    (!state.svc || r.service === state.svc || r.to.includes(state.svc)) &&
    (!state.q || [r.key, r.source, r.note || "", ...r.refs, r.symptom?.text || ""].join(" ").toLowerCase().includes(state.q)));
}

function render() {
  for (const b of $("kpis").children) b.setAttribute("aria-selected", b.dataset.s === state.status);
  $("svc").value = state.svc;
  const rows = shown();
  $("count").textContent = `${rows.length} / ${DATA.rows.length} biến`;
  const groups = owners.filter(s => rows.some(r => r.service === s));
  // A search shows every match, so a collapsed group never hides what was asked for.
  const open = s => state.q || !state.closed.has(s);
  $("toggle").hidden = !!state.q;
  $("toggle").textContent = groups.some(open) ? "Thu gọn tất cả" : "Mở tất cả";
  $("toggle").onclick = () => { state.closed = groups.some(open) ? new Set(owners) : new Set(); render(); };
  let html = "";
  for (const s of groups) {
    const group = rows.filter(r => r.service === s);
    html += `<tr class="group"><td colspan="4"><button type="button" data-s="${s}" aria-expanded="${open(s)}"><b>${esc(label(s))}</b><span class="count-pill">${group.length}</span></button></td></tr>`;
    if (!open(s)) continue;
    for (const r of group) {
      const to = peers(r);
      html += `<tr class="item" data-i="${r.i}" aria-selected="${state.key === r.key}">` +
        `<td><span class="key">${esc(r.key)}</span>${r.kind === "secret" ? '<span class="tag">secret</span>' : ""}` +
        `<span class="sub">${to.length ? "→ " + esc(to.join(", ")) : "Cấu hình riêng của service"}</span></td>` +
        `<td class="col-source">${source(r)}${r.updatedAt ? `<span class="sub num">sửa ${esc(r.updatedAt)}</span>` : ""}</td>` +
        `<td><span class="pill p-${r.main}">${esc(STATUS[r.main])}</span></td>` +
        `<td class="n num col-refs">${r.refCount || "—"}</td></tr>`;
    }
  }
  $("rows").innerHTML = html || `<tr><td colspan="4" class="empty">Không có biến nào khớp bộ lọc này.</td></tr>`;
  for (const tr of $("rows").querySelectorAll("tr.item")) tr.onclick = () => pick(DATA.rows[tr.dataset.i].key);
  for (const b of $("rows").querySelectorAll("tr.group button")) b.onclick = () => {
    state.closed.has(b.dataset.s) ? state.closed.delete(b.dataset.s) : state.closed.add(b.dataset.s);
    render();
  };
}

function pick(key) {
  state.key = key;
  for (const tr of $("rows").querySelectorAll("tr.item")) tr.setAttribute("aria-selected", DATA.rows[tr.dataset.i].key === key);
  detail();
}

function detail() {
  const rows = DATA.rows.filter(r => r.key === state.key);
  if (!rows.length) { $("detail").innerHTML = `<p class="note">Chọn một biến trong bảng.</p>`; return; }
  $("detail").innerHTML = `<h2 class="key">${esc(state.key)}</h2>` +
    `<div class="meta">${rows.some(r => r.kind === "secret") ? "Secret" : "Config"}, giữ ở ${rows.length} nơi</div>` +
    rows.map(r => {
      const to = peers(r);
      return `<div class="source"><dl class="kv">` +
        `<dt>Nguồn</dt><dd>${source(r)}</dd>` +
        `<dt>Service</dt><dd>${esc(label(r.service))}</dd>` +
        `<dt>Nối tới</dt><dd>${to.length ? esc(to.join(", ")) : "—"}</dd>` +
        `<dt>Trạng thái</dt><dd><span class="pill p-${r.main}">${esc(STATUS[r.main])}</span></dd>` +
        (r.updatedAt ? `<dt>Sửa lúc</dt><dd class="num">${esc(r.updatedAt)}</dd>` : "") +
        `</dl>` +
        (r.note ? `<div class="note">${esc(r.note)}</div>` : "") +
        (r.symptom ? `<div class="breaks"><span class="label">Khi sai hoặc thiếu</span>${esc(r.symptom.text)}<div class="path">${esc(r.symptom.source)}</div></div>` : "") +
        (r.refs.length ? `<div><span class="label">Dùng trong code (${r.refCount})</span>${r.refs.map(x => `<div class="path">${esc(x)}</div>`).join("")}` +
          (r.refCount > r.refs.length ? `<div class="path">và ${r.refCount - r.refs.length} chỗ khác</div>` : "") + `</div>` : "") +
        `</div>`;
    }).join("");
}

// Open on a variable whose failure the map explains and that needs action, so the detail panel is never blank.
render();
pick((DATA.rows.find(r => r.symptom && r.main !== "used") || DATA.rows.find(r => r.symptom) || DATA.rows[0]).key);
</script>
</body>
