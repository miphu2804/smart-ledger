name: CD

# Called by ci.yml, never triggered directly. It runs in the caller's context, so
# `github.ref_name` is the pushed branch and the GitHub environment branch policies apply.
on:
  workflow_call:

jobs:
  # Deploys backend services to Railway. Each GitHub environment holds its own
  # environment-scoped Railway project token and branch policy; `railway-production`
  # requires approval.
  deploy:
    runs-on: ubuntu-24.04
    environment: ${{ github.ref_name == 'main' && 'railway-production' || 'railway-staging' }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.63.1
      # AI first: Core calls AI, so the new Core should not start against an old AI.
      - name: Deploy ai
        id: deploy_ai
        run: railway up backend/ai --path-as-root --service ai --ci
      - name: Deploy core
        id: deploy_core
        run: railway up backend/core --path-as-root --service core --ci
      - name: Build deploy report
        if: always()
        env:
          AI_OUTCOME: ${{ steps.deploy_ai.outcome }}
          CORE_OUTCOME: ${{ steps.deploy_core.outcome }}
          TARGET_ENV: ${{ github.ref_name == 'main' && 'railway-production' || 'railway-staging' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "# Deploy results"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Environment | $TARGET_ENV |"
            echo "| Branch | ${GITHUB_REF_NAME} |"
            echo "| Commit | ${GITHUB_SHA::7} |"
            echo "| Triggered by | ${GITHUB_ACTOR} |"
            echo "| Run | $RUN_URL |"
            echo
            echo "| Service | Result |"
            echo "|---|---|"
            echo "| ai | $AI_OUTCOME |"
            echo "| core | $CORE_OUTCOME |"
          } > deploy-summary.md
          cat deploy-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: deploy-summary-${{ github.ref_name }}
          path: deploy-summary.md
          if-no-files-found: error
          retention-days: 14
