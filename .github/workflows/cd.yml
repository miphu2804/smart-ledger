name: CD

# Deploys one tested commit of `staging` or `main`. ci.yml starts it after a push, once the checks of an area pass,
# with the areas to deploy; a person can start it too (Actions → CD → Run workflow, branch = the one to deploy), e.g. to
# redeploy after changing an environment variable. It picks its own runner, so CI and CD can run on different
# machines. Each area deploys from its own file and waits for nothing but the gate. See docs/development/ci-cd.md#steps.

run-name: CD ${{ github.ref_name }} ${{ inputs.sha }}

on:
  workflow_dispatch:
    inputs:
      runner:
        description: default reads the repository variable CD_RUNNER, else CI_RUNNER, else github-hosted; see docs/development/ci-cd.md#ci-runners
        type: choice
        required: true
        default: default
        options: [default, github-hosted, self-hosted, auto]
      sha:
        description: Full commit SHA on this branch; its CI run must have passed the checks of each chosen area
        type: string
        required: true
      ci-run-id:
        description: CI run that tested the commit; empty uses the latest push run of CI for it
        type: string
        default: ""
      backend-ai:
        description: Deploy backend `ai` to the VPS
        type: boolean
        default: false
      backend-core:
        description: Deploy backend `core` to the VPS
        type: boolean
        default: false
      web:
        description: Deploy the mobile web on Vercel
        type: boolean
        default: false
      landing:
        description: Deploy the landing on Vercel
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ### Runner: every job below runs where this job picks ###

  select-runner:
    uses: ./.github/workflows/select-runner.yml
    with:
      choice: ${{ inputs.runner != 'default' && inputs.runner || vars.CD_RUNNER || vars.CI_RUNNER || 'github-hosted' }}
    secrets:
      RUNNERS_READ_TOKEN: ${{ secrets.RUNNERS_READ_TOKEN }}

  ### Gate: the branch, the commit and its CI result ###

  # The GitHub environments still decide who may deploy where (branch policy, production approval); this job makes
  # sure only a commit of this branch whose CI checks passed reaches them.
  gate:
    needs: [select-runner]
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs_on) }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the branch, the commit and its CI run
        env:
          GH_TOKEN: ${{ github.token }}
          SMARTLEDGER_COMMIT: ${{ inputs.sha }}
          SMARTLEDGER_TESTED_RUN_ID: ${{ inputs.ci-run-id }}
          SMARTLEDGER_DEPLOY_AI: ${{ inputs.backend-ai }}
          SMARTLEDGER_DEPLOY_CORE: ${{ inputs.backend-core }}
          SMARTLEDGER_DEPLOY_WEB: ${{ inputs.web }}
          SMARTLEDGER_DEPLOY_LANDING: ${{ inputs.landing }}
        run: scripts/ci/check-deploy-gate.sh

  ### Deploy: one file per area, each with its own GitHub environment ###

  # AI first inside deploy-backend.yml: Core calls AI, so the new Core should not start against an old AI.
  deploy-backend:
    if: inputs.backend-ai || inputs.backend-core
    needs: [select-runner, gate]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-backend.yml
    with:
      runs-on: ${{ needs.select-runner.outputs.runs_on }}
      sha: ${{ inputs.sha }}
      ai: ${{ inputs.backend-ai }}
      core: ${{ inputs.backend-core }}
    secrets: inherit

  # A job of its own, so a failure marks the CD run without changing the deploy's result or its image cleanup. Staging
  # only: the collection has no production environment. The Smoke folder is read-only and needs no credentials.
  smoke-staging:
    if: github.ref_name == 'staging' && needs.deploy-backend.result == 'success'
    needs: [select-runner, deploy-backend]
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs_on) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Run the Bruno smoke folder
        working-directory: scripts/bruno
        run: npx --yes @usebruno/cli@4.3.0 run Smoke --env staging

  deploy-web:
    if: inputs.web
    needs: [select-runner, gate]
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-web.yml
    with:
      runs-on: ${{ needs.select-runner.outputs.runs_on }}
      sha: ${{ inputs.sha }}
    secrets: inherit

  deploy-landing:
    if: inputs.landing
    needs: [select-runner, gate]
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-landing.yml
    with:
      runs-on: ${{ needs.select-runner.outputs.runs_on }}
      sha: ${{ inputs.sha }}
    secrets: inherit
