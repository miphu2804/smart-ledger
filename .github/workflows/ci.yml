name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  ai:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smartledger
          POSTGRES_PASSWORD: smartledger
          POSTGRES_DB: smartledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartledger -d smartledger_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql://smartledger:smartledger@localhost:5432/smartledger_test
    defaults:
      run:
        working-directory: backend/ai
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.11"
      - run: uv sync --group dev
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest

  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: bash ./mvnw --batch-mode --no-transfer-progress verify
