name: CI

# Continuous integration: decides which areas changed, then calls one test module per area
# (`_test-*.yml`, `_build-images.yml`). After a green push to `staging` or `main` it dispatches
# cd.yml for the changed areas; deploys never run in this workflow. Keep this file named ci.yml:
# the gates of cd.yml and mobile-release.yml look up its runs for the commit.
on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

# A new commit on a pull request cancels the older run of that pull request. Pushes to `staging`
# and `main` are grouped by commit, so a push is never cancelled or queued behind another one and
# every push dispatches the deploy of what it changed.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ### Changes: which areas this pull request or push touched ###

  # Each module below runs only when its area changed, so a docs-only or web-only change skips the
  # backend. A skipped job counts as passed for `ci-gate` and for the `gate` of mobile-release.yml.
  # Filtering here, not with `on.paths`, keeps `ci-gate` reporting a result on every commit.
  # An area runs when its source, its own module or this file changed; Markdown alone runs nothing.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ai: ${{ steps.filter.outputs.ai }}
      core: ${{ steps.filter.outputs.core }}
      mobile: ${{ steps.filter.outputs.mobile }}
      landing: ${{ steps.filter.outputs.landing }}
      images: ${{ steps.images.outputs.services }}
    steps:
      - uses: actions/checkout@v7
      # A pull request is compared with its base branch; a push with the commit before the push.
      # With `every`, a file counts for a filter only when it matches all of its patterns: the brace
      # list says which paths belong to the area, and `!**/*.md` drops documentation.
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          base: ${{ github.ref_name }}
          predicate-quantifier: every
          filters: |
            ai:
              # The AI integration tests apply the supabase migrations.
              - "{backend/ai/**,supabase/**,.github/workflows/ci.yml,.github/workflows/_test-ai.yml,.github/workflows/_deploy-railway.yml,.github/workflows/cd.yml}"
              - "!**/*.md"
            core:
              - "{backend/core/**,.github/workflows/ci.yml,.github/workflows/_test-core.yml,.github/workflows/_deploy-railway.yml,.github/workflows/cd.yml}"
              - "!**/*.md"
            mobile:
              - "{frontend/mobile/**,.github/workflows/ci.yml,.github/workflows/_test-mobile-web.yml,.github/workflows/_deploy-web.yml,.github/workflows/cd.yml}"
              - "!**/*.md"
            landing:
              - "{frontend/web/**,.github/workflows/ci.yml,.github/workflows/_test-landing.yml,.github/workflows/_deploy-landing.yml,.github/workflows/cd.yml}"
              - "!**/*.md"
            # Only the files that can break an image build; source code is compiled by the tests.
            images_ai:
              - "{backend/ai/{Dockerfile,.dockerignore,pyproject.toml,uv.lock},compose.yaml,.github/workflows/ci.yml,.github/workflows/_build-images.yml}"
            images_core:
              - "{backend/core/{Dockerfile,.dockerignore,pom.xml},compose.yaml,.github/workflows/ci.yml,.github/workflows/_build-images.yml}"
      - name: List images to build
        id: images
        env:
          AI: ${{ steps.filter.outputs.images_ai }}
          CORE: ${{ steps.filter.outputs.images_core }}
        run: |
          services=()
          if [ "$AI" = true ]; then services+=('"ai"'); fi
          if [ "$CORE" = true ]; then services+=('"core"'); fi
          echo "services=[$(IFS=,; echo "${services[*]}")]" >> "$GITHUB_OUTPUT"

  ### Test: lint, tests and builds for the areas that changed ###

  ai:
    needs: [changes]
    if: needs.changes.outputs.ai == 'true'
    uses: ./.github/workflows/_test-ai.yml

  core:
    needs: [changes]
    if: needs.changes.outputs.core == 'true'
    uses: ./.github/workflows/_test-core.yml

  mobile-web:
    needs: [changes]
    if: needs.changes.outputs.mobile == 'true'
    uses: ./.github/workflows/_test-mobile-web.yml

  landing:
    needs: [changes]
    if: needs.changes.outputs.landing == 'true'
    uses: ./.github/workflows/_test-landing.yml

  images:
    needs: [changes]
    if: needs.changes.outputs.images != '[]'
    # The module's manual-run summary job asks for `actions: read`; a called job may not ask for
    # more than its caller grants, even when it is skipped.
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_build-images.yml
    with:
      services: ${{ needs.changes.outputs.images }}

  ### Gate: the one required check for pull requests into `staging` and `main` ###

  # Branch protection requires only this job, so adding, renaming or splitting a module does not
  # touch the protection rules. Skipped modules pass; a failed or cancelled one fails the gate.
  ci-gate:
    if: always()
    needs: [changes, ai, core, mobile-web, landing, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every module to pass or skip
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [ "$FAILED" = true ]; then
            echo "::error::A CI module failed or was cancelled; see the jobs above."
            exit 1
          fi

  ### Deploy: hand the tested commit to cd.yml ###

  # A push that passed `ci-gate` dispatches cd.yml on the same branch with this commit and the
  # areas that changed. GITHUB_TOKEN may start a workflow_dispatch run, unlike other events.
  # To redeploy without a change (for example after editing an environment variable), run CD by hand.
  cd:
    name: Dispatch CD
    needs: [changes, ci-gate]
    if: >-
      github.event_name == 'push' && needs.ci-gate.result == 'success'
      && (needs.changes.outputs.ai == 'true' || needs.changes.outputs.core == 'true'
        || needs.changes.outputs.mobile == 'true' || needs.changes.outputs.landing == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch cd.yml
        env:
          GH_TOKEN: ${{ github.token }}
          AI: ${{ needs.changes.outputs.ai }}
          CORE: ${{ needs.changes.outputs.core }}
          WEB: ${{ needs.changes.outputs.mobile }}
          LANDING: ${{ needs.changes.outputs.landing }}
        run: |
          gh workflow run cd.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f sha="$GITHUB_SHA" -f ai="$AI" -f core="$CORE" -f web="$WEB" -f landing="$LANDING"
          echo "CD dispatched for ${GITHUB_SHA::7}: ai=$AI core=$CORE web=$WEB landing=$LANDING" >> "$GITHUB_STEP_SUMMARY"

  ### Report: one table per run, on the run page and as artifact `ci-summary` ###

  summary:
    name: CI result summary
    if: always()
    needs: [changes, ai, core, mobile-web, landing, images, ci-gate, cd]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: List test counts
        env:
          AI_TESTS: ${{ needs.ai.outputs.tests }}
          AI_FAILURES: ${{ needs.ai.outputs.failures }}
          AI_ERRORS: ${{ needs.ai.outputs.errors }}
          AI_SKIPPED: ${{ needs.ai.outputs.skipped }}
          CORE_TESTS: ${{ needs.core.outputs.tests }}
          CORE_FAILURES: ${{ needs.core.outputs.failures }}
          CORE_ERRORS: ${{ needs.core.outputs.errors }}
          CORE_SKIPPED: ${{ needs.core.outputs.skipped }}
        run: |
          {
            echo "| Suite | Tests | Failures | Errors | Skipped |"
            echo "|---|---:|---:|---:|---:|"
            printf '| AI (Python) | %s | %s | %s | %s |\n' \
              "${AI_TESTS:-—}" "${AI_FAILURES:-—}" "${AI_ERRORS:-—}" "${AI_SKIPPED:-—}"
            printf '| Core (Java) | %s | %s | %s | %s |\n' \
              "${CORE_TESTS:-—}" "${CORE_FAILURES:-—}" "${CORE_ERRORS:-—}" "${CORE_SKIPPED:-—}"
          } > tests.md
      - name: Write the run summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/run-summary.sh tests.md
      - uses: actions/upload-artifact@v7
        with:
          name: ci-summary
          path: run-summary.md
          if-no-files-found: error
          retention-days: 14
