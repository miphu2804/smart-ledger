name: CI

on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      runner:
        description: self-hosted runs every job on the repository's self-hosted machines, for when GitHub-hosted runners are unavailable; auto uses a free self-hosted machine when one is online
        type: choice
        required: true
        default: github-hosted
        options: [github-hosted, self-hosted, auto]

jobs:
  ### Runner: every job below runs where this job picks ###

  # The run starts with `runner` (manual run) or the repository variable CI_RUNNER, default github-hosted. Pull requests
  # from forks always stay GitHub-hosted, because the repository is public and a fork must not run code on a self-hosted
  # machine. See docs/development/ci-cd.md#ci-runners.
  select-runner:
    uses: ./.github/workflows/select-runner.yml
    with:
      choice: ${{ inputs.runner || vars.CI_RUNNER || 'github-hosted' }}
      allow-self-hosted: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    secrets:
      RUNNERS_READ_TOKEN: ${{ secrets.RUNNERS_READ_TOKEN }}

  ### Changes: which areas this pull request or push touched ###

  # Each test and deploy job below runs only when its area changed, so a docs-only or web-only change
  # skips the backend. A skipped job counts as passed for required checks and for the `gate` of
  # mobile-release.yml. Filtering here, not with `on.paths`, keeps every check reporting a result.
  # A change to this workflow, cd.yml or select-runner.yml runs everything; a change to a deploy file runs its area.
  changes:
    needs: [select-runner]
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs_on) }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ai: ${{ steps.filter.outputs.ai }}
      core: ${{ steps.filter.outputs.core }}
      mobile: ${{ steps.filter.outputs.mobile }}
      landing: ${{ steps.filter.outputs.landing }}
      containers: ${{ steps.filter.outputs.containers }}
    steps:
      - uses: actions/checkout@v7
      # A pull request is compared with its base branch; a push with the commit before the push.
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          base: ${{ github.ref_name }}
          filters: |
            ai:
              - .github/workflows/ci.yml
              - .github/workflows/select-runner.yml
              - .github/workflows/cd.yml
              - .github/workflows/deploy-backend.yml
              - backend/ai/**
              # The AI integration tests apply these migrations.
              - supabase/**
            core:
              - .github/workflows/ci.yml
              - .github/workflows/select-runner.yml
              - .github/workflows/cd.yml
              - .github/workflows/deploy-backend.yml
              - backend/core/**
            mobile:
              - .github/workflows/ci.yml
              - .github/workflows/select-runner.yml
              - .github/workflows/cd.yml
              - .github/workflows/deploy-web.yml
              - frontend/mobile/**
            landing:
              - .github/workflows/ci.yml
              - .github/workflows/select-runner.yml
              - .github/workflows/cd.yml
              - .github/workflows/deploy-landing.yml
              - frontend/web/**
            containers:
              - .github/workflows/ci.yml
              - .github/workflows/select-runner.yml
              - .github/workflows/cd.yml
              - compose.yaml
              - backend/ai/**
              - backend/core/**

  ### Test: lint, tests and builds for the areas that changed ###

  ai:
    needs: [select-runner, changes]
    if: needs.changes.outputs.ai == 'true'
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs_on) }}
    outputs:
      tests: ${{ steps.test-results.outputs.tests }}
      failures: ${{ steps.test-results.outputs.failures }}
      errors: ${{ steps.test-results.outputs.errors }}
      skipped: ${{ steps.test-results.outputs.skipped }}
    defaults:
      run:
        working-directory: backend/ai
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.11"
      # Started with docker on every runner, not as a service container, so one path serves GitHub-hosted and
      # self-hosted machines (which cannot run service containers).
      - name: Start PostgreSQL
        working-directory: .
        run: |
          # A per-job name and a free host port, so jobs running side by side on one machine do not collide. The
          # readiness check uses TCP: while initialising, the image runs a temporary server on its Unix socket only.
          docker rm -f ci-postgres-${{ github.run_id }}-${{ github.job }} >/dev/null 2>&1 || true
          docker run -d --name ci-postgres-${{ github.run_id }}-${{ github.job }} -p 127.0.0.1::5432 \
            -e POSTGRES_DB=smartledger_test -e POSTGRES_USER=smartledger -e POSTGRES_PASSWORD=smartledger pgvector/pgvector:pg17
          until docker exec ci-postgres-${{ github.run_id }}-${{ github.job }} pg_isready -h 127.0.0.1 -U smartledger -d smartledger_test >/dev/null 2>&1; do sleep 1; done
          echo "PG_PORT=$(docker port ci-postgres-${{ github.run_id }}-${{ github.job }} 5432/tcp | head -1 | sed 's/.*://')" >> "$GITHUB_ENV"
      - run: uv sync --group dev
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest --junitxml=pytest-results.xml
        env:
          POSTGRES_TEST_URL: postgresql://smartledger:smartledger@127.0.0.1:${{ env.PG_PORT }}/smartledger_test
      - name: Stop PostgreSQL
        if: always()
        working-directory: .
        run: docker rm -f ci-postgres-${{ github.run_id }}-${{ github.job }}
      - name: Capture test counts
        id: test-results
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          from xml.etree import ElementTree

          report = Path("pytest-results.xml")
          counts = {name: "n/a" for name in ("tests", "failures", "errors", "skipped")}
          if report.exists():
              root = ElementTree.parse(report).getroot()
              suites = [root] if root.tag == "testsuite" else root.findall(".//testsuite")
              if not suites:
                  suites = [root]
              counts = {
                  name: str(sum(int(suite.get(name, "0")) for suite in suites))
                  for name in counts
              }
          for name, value in counts.items():
              print(f"{name}={value}")
          PY

  core:
    needs: [select-runner, changes]
    if: needs.changes.outputs.core == 'true'
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs_on) }}
    outputs:
      tests: ${{ steps.test-results.outputs.tests }}
      failures: ${{ steps.test-results.outputs.failures }}
      errors: ${{ steps.test-results.outputs.errors }}
      skipped: ${{ steps.test-results.outputs.skipped }}
    defaults:
      run:
        working-directory: backend/core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: ${{ runner.environment == 'github-hosted' && 'maven' || '' }}
      # Started with docker on every runner, not as a service container, so one path serves GitHub-hosted and
      # self-hosted machines (which cannot run service containers).
      - name: Start PostgreSQL
        working-directory: .
        run: |
          # A per-job name and a free host port, so jobs running side by side on one machine do not collide. The
          # readiness check uses TCP: while initialising, the image runs a temporary server on its Unix socket only.
          docker rm -f ci-postgres-${{ github.run_id }}-${{ github.job }} >/dev/null 2>&1 || true
          docker run -d --name ci-postgres-${{ github.run_id }}-${{ github.job }} -p 127.0.0.1::5432 \
            -e POSTGRES_DB=smartledger -e POSTGRES_USER=smartledger -e POSTGRES_PASSWORD=smartledger postgres:16
          until docker exec ci-postgres-${{ github.run_id }}-${{ github.job }} pg_isready -h 127.0.0.1 -U smartledger -d smartledger >/dev/null 2>&1; do sleep 1; done
          echo "PG_PORT=$(docker port ci-postgres-${{ github.run_id }}-${{ github.job }} 5432/tcp | head -1 | sed 's/.*://')" >> "$GITHUB_ENV"
      - name: Verify Core with PostgreSQL tests enabled
        env:
          CORE_TEST_POSTGRES_URL: jdbc:postgresql://127.0.0.1:${{ env.PG_PORT }}/smartledger
          CORE_TEST_POSTGRES_USERNAME: smartledger
          CORE_TEST_POSTGRES_PASSWORD: smartledger
        run: bash ./mvnw --batch-mode --no-transfer-progress verify
      - name: Require PostgreSQL test execution
        run: |
          python3 scripts/test_verify_postgres_tests.py
          python3 scripts/verify_postgres_tests.py target/surefire-reports
      - name: Migrate a fresh PostgreSQL database
        run: |
          docker run --rm --network host \
            --volume "$GITHUB_WORKSPACE/backend/core/src/main/resources/db/migration:/flyway/sql:ro" \
            flyway/flyway:13.7.0 \
            "-url=jdbc:postgresql://127.0.0.1:$PG_PORT/smartledger" \
            -user=smartledger \
            -password=smartledger \
            -locations=filesystem:/flyway/sql \
            -connectRetries=10 \
            migrate
      - name: Verify Core tables exist
        run: |
          table_count="$(docker run --rm --network host -e PGPASSWORD=smartledger postgres:16 \
            psql -h 127.0.0.1 -p "$PG_PORT" -U smartledger -d smartledger -Atc \
            "SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tablename IN ('users', 'auth_identities', 'shops')")"
          test "$table_count" = "3"
      - name: Stop PostgreSQL
        if: always()
        working-directory: .
        run: docker rm -f ci-postgres-${{ github.run_id }}-${{ github.job }}
      - name: Capture test counts
        id: test-results
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          from xml.etree import ElementTree

          reports = sorted(Path("target/surefire-reports").glob("TEST-*.xml"))
          totals = {name: 0 for name in ("tests", "failures", "errors", "skipped")}
          if not reports:
              totals = {name: "n/a" for name in totals}
          else:
              for report in reports:
                  suite = ElementTree.parse(report).getroot()
                  for name in totals:
                      totals[name] += int(suite.get(name, "0"))
          for name, value in totals.items():
              print(f"{name}={value}")
          PY

  mobile-web:
    needs: [select-runner, changes]
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs_on) }}
    env:
      EXPO_PUBLIC_USE_MOCK: "true"
      EXPO_PUBLIC_MOCK_CORE: "true"
      EXPO_PUBLIC_MOCK_SHOPS: "true"
      EXPO_PUBLIC_API_ENDPOINT: http://localhost:8000
    defaults:
      run:
        working-directory: frontend/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: frontend/mobile/package-lock.json
      - name: Keep the Metro cache job-local
        # Metro caches transformed modules (with EXPO_PUBLIC_* inlined) under TMPDIR; on a shared machine
        # the mock build of mobile-web would otherwise leak into the real bundle of deploy-web.
        if: runner.environment == 'self-hosted'
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run export:web

  landing:
    needs: [select-runner, changes]
    if: needs.changes.outputs.landing == 'true'
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs_on) }}
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  container-images:
    needs: [select-runner, changes]
    if: needs.changes.outputs.containers == 'true'
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs_on) }}
    env:
      DATABASE_URL: jdbc:postgresql://ci-placeholder:5432/ci
      DATABASE_USERNAME: ci-placeholder
      DATABASE_PASSWORD: ci-placeholder
      POSTGRES_URL: postgresql://ci-placeholder:5432/ci
      REDIS_URL: redis://ci-placeholder:6379/0
      FIREBASE_PROJECT_ID: ci-placeholder
      GOOGLE_APPLICATION_CREDENTIALS: ./backend/core/.env.example
    steps:
      - uses: actions/checkout@v7
      - name: Build custom service images
        run: docker compose build

  ### Report: one table of test results per run ###

  summary:
    name: CI result summary
    if: always()
    needs: [select-runner, ai, core, mobile-web, landing, container-images]
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs_on) }}
    steps:
      - name: Build compact report
        env:
          AI_RESULT: ${{ needs.ai.result }}
          AI_TESTS: ${{ needs.ai.outputs.tests }}
          AI_FAILURES: ${{ needs.ai.outputs.failures }}
          AI_ERRORS: ${{ needs.ai.outputs.errors }}
          AI_SKIPPED: ${{ needs.ai.outputs.skipped }}
          CORE_RESULT: ${{ needs.core.result }}
          CORE_TESTS: ${{ needs.core.outputs.tests }}
          CORE_FAILURES: ${{ needs.core.outputs.failures }}
          CORE_ERRORS: ${{ needs.core.outputs.errors }}
          CORE_SKIPPED: ${{ needs.core.outputs.skipped }}
          MOBILE_RESULT: "${{ needs['mobile-web'].result }}"
          LANDING_RESULT: "${{ needs.landing.result }}"
          CONTAINER_RESULT: "${{ needs['container-images'].result }}"
        run: |
          {
            echo "# CI results"
            echo
            echo "| Suite | Result | Tests | Failures | Errors | Skipped |"
            echo "|---|---:|---:|---:|---:|---:|"
            printf '| AI (Python) | %s | %s | %s | %s | %s |\n' \
              "$AI_RESULT" "${AI_TESTS:-n/a}" "${AI_FAILURES:-n/a}" "${AI_ERRORS:-n/a}" "${AI_SKIPPED:-n/a}"
            printf '| Core (Java) | %s | %s | %s | %s | %s |\n' \
              "$CORE_RESULT" "${CORE_TESTS:-n/a}" "${CORE_FAILURES:-n/a}" "${CORE_ERRORS:-n/a}" "${CORE_SKIPPED:-n/a}"
            printf '| Mobile web | %s | n/a | n/a | n/a | n/a |\n' "$MOBILE_RESULT"
            printf '| Landing (web) | %s | n/a | n/a | n/a | n/a |\n' "$LANDING_RESULT"
            printf '| Container images | %s | n/a | n/a | n/a | n/a |\n' "$CONTAINER_RESULT"
          } > ci-summary.md
          cat ci-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        # The summary is already in the job summary; a full artifact quota must not fail CI or skip deploys.
        continue-on-error: true
        with:
          name: ci-summary
          path: ci-summary.md
          if-no-files-found: error
          retention-days: 14

  ### Hand-off to CD: start cd.yml for the areas whose checks passed ###

  # Push to `staging` or `main` only. Each area is judged on its own checks, so a red `landing` does not hold back the
  # backend: an area deploys when it changed and its checks passed or were skipped. A re-run (`github.run_attempt > 1`)
  # hands off every area whose checks pass, so a changed environment variable can be picked up by re-running all jobs
  # (or by starting CD by hand). CD picks its own runner (CD_RUNNER, else CI_RUNNER), from this branch's cd.yml.
  cd:
    if: >-
      !cancelled() && github.event_name == 'push' && needs.changes.result == 'success'
    needs: [select-runner, changes, ai, core, mobile-web, landing, container-images]
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs_on) }}
    permissions:
      actions: write
    steps:
      - name: Start CD
        env:
          # A workflow_dispatch from GITHUB_TOKEN starts a new run, unlike most events it triggers.
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RERUN: ${{ github.run_attempt > 1 }}
          CHANGED_AI: ${{ needs.changes.outputs.ai }}
          CHANGED_CORE: ${{ needs.changes.outputs.core }}
          CHANGED_MOBILE: ${{ needs.changes.outputs.mobile }}
          CHANGED_LANDING: ${{ needs.changes.outputs.landing }}
          AI_RESULT: ${{ needs.ai.result }}
          CORE_RESULT: ${{ needs.core.result }}
          CONTAINERS_RESULT: ${{ needs['container-images'].result }}
          MOBILE_RESULT: ${{ needs['mobile-web'].result }}
          LANDING_RESULT: ${{ needs.landing.result }}
        run: |
          set -euo pipefail
          ok() { local r; for r in "$@"; do [ "$r" = success ] || [ "$r" = skipped ] || return 1; done; }
          want() { [ "$RERUN" = true ] || [ "$1" = true ]; }
          backend_ok=false; ok "$AI_RESULT" "$CORE_RESULT" "$CONTAINERS_RESULT" && backend_ok=true
          ai=false; core=false; web=false; landing=false
          [ "$backend_ok" = true ] && want "$CHANGED_AI" && ai=true
          [ "$backend_ok" = true ] && want "$CHANGED_CORE" && core=true
          ok "$MOBILE_RESULT" && want "$CHANGED_MOBILE" && web=true
          ok "$LANDING_RESULT" && want "$CHANGED_LANDING" && landing=true
          echo "backend-ai=$ai backend-core=$core web=$web landing=$landing"
          if [ "$ai$core$web$landing" = falsefalsefalsefalse ]; then
            echo "Nothing to deploy."; exit 0
          fi
          gh workflow run cd.yml --repo "$REPO" --ref "$REF_NAME" -f runner=default -f sha="$SHA" -f ci-run-id="$RUN_ID" \
            -f backend-ai="$ai" -f backend-core="$core" -f web="$web" -f landing="$landing"
          echo "Started CD for ${SHA::7} on $REF_NAME: backend-ai=$ai backend-core=$core web=$web landing=$landing" >> "$GITHUB_STEP_SUMMARY"

  ### Metadata: who started this run, when, how long, each job's result ###

  # Uploads `meta-ci-<environment>-<run id>-<attempt>`; artifact-cleanup.yml keeps the newest ones.
  metadata:
    if: always()
    needs: [select-runner, changes, ai, core, mobile-web, landing, container-images, summary, cd]
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs_on) }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/run-metadata
        with:
          workflow: ci
          environment: ${{ github.event_name == 'pull_request' && 'pr' || (github.ref_name == 'main' && 'production' || (github.ref_name == 'staging' && 'staging' || 'other')) }}
          token: ${{ github.token }}
