name: CI

on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      runner:
        description: self-hosted runs every job on the repository's self-hosted machines, for when GitHub-hosted runners are unavailable; auto uses a free self-hosted machine when one is online
        type: choice
        required: true
        default: github-hosted
        options: [github-hosted, self-hosted, auto]

# A newer push to a pull request cancels its older run so the self-hosted runner is not queued behind stale work; push runs on staging and main are never cancelled because they hand off to CD.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ### Runner: every job below runs where this job picks ###

  # The run starts with `runner` (manual run) or the repository variable CI_RUNNER, default github-hosted. Pull requests
  # from forks always stay GitHub-hosted, because the repository is public and a fork must not run code on a self-hosted
  # machine. See docs/development/ci-cd.md#ci-runners.
  select-runner:
    uses: ./.github/workflows/select-runner.yml
    with:
      choice: ${{ inputs.runner || vars.CI_RUNNER || 'github-hosted' }}
      allow-self-hosted: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    secrets:
      RUNNERS_READ_TOKEN: ${{ secrets.RUNNERS_READ_TOKEN }}

  ### Changes: which areas this pull request or push touched ###

  # Each test and deploy job below runs only when its area changed, so a docs-only or web-only change
  # skips the backend. A skipped job counts as passed for required checks and for the `gate` of
  # mobile-release.yml. Filtering here, not with `on.paths`, keeps every check reporting a result.
  # A change to this workflow, cd.yml, select-runner.yml or scripts/ci/ runs everything; a change to a deploy file runs its area.
  changes:
    needs: [select-runner]
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs_on) }}
    permissions:
      contents: read
    outputs:
      ai: ${{ steps.filter.outputs.ai }}
      core: ${{ steps.filter.outputs.core }}
      mobile: ${{ steps.filter.outputs.mobile }}
      landing: ${{ steps.filter.outputs.landing }}
      containers: ${{ steps.filter.outputs.containers }}
      shell: ${{ steps.filter.outputs.shell }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      # The whole history, so changes.sh can diff against the base commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A pull request is compared with its base commit; a push with the commit before the push.
      - name: Find the changed areas
        id: filter
        env:
          SMARTLEDGER_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/ci/changes.sh

  ### Test: lint, tests and builds for the areas that changed ###

  # shellcheck lints every shell script and, through actionlint, every `run:` block in the workflows. Both come with the
  # GitHub-hosted image and with Homebrew on the self-hosted machines. backend/core is not linted.
  shellcheck:
    needs: [select-runner, changes]
    if: needs.changes.outputs.shell == 'true'
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs_on) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck and actionlint
        run: |
          command -v shellcheck > /dev/null || brew install shellcheck
          command -v actionlint > /dev/null || brew install actionlint
      - name: Lint workflows and scripts
        run: |
          actionlint
          git ls-files -z '*.sh' ':!backend/core' | xargs -0 shellcheck --severity=warning
          scripts/ci/check-provider-coupling.sh

  # docs checks that the .okf/ metadata bundle matches the Markdown documents and that their relative links resolve.
  # It needs only Python 3 from the runner image. See docs/README.md#conventions.
  docs:
    needs: [select-runner, changes]
    if: needs.changes.outputs.docs == 'true'
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs_on) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the OKF bundle
        run: python3 scripts/docs/okf_sync.py --check

  ai:
    needs: [select-runner, changes]
    if: needs.changes.outputs.ai == 'true'
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs_on) }}
    outputs:
      tests: ${{ steps.test-results.outputs.tests }}
      failures: ${{ steps.test-results.outputs.failures }}
      errors: ${{ steps.test-results.outputs.errors }}
      skipped: ${{ steps.test-results.outputs.skipped }}
    defaults:
      run:
        working-directory: backend/ai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
      # Started with docker on every runner, not as a service container, so one path serves GitHub-hosted and
      # self-hosted machines (which cannot run service containers).
      - name: Start PostgreSQL
        working-directory: .
        run: scripts/ci/start-postgres.sh pgvector/pgvector:pg17 smartledger_test
      - run: uv sync --group dev
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest --junitxml=pytest-results.xml
        env:
          POSTGRES_TEST_URL: postgresql://smartledger:smartledger@127.0.0.1:${{ env.PG_PORT }}/smartledger_test
      - name: Stop PostgreSQL
        if: always()
        working-directory: .
        run: scripts/ci/stop-postgres.sh
      - name: Capture test counts
        id: test-results
        if: always()
        working-directory: .
        run: scripts/ci/capture-test-counts.sh junit backend/ai/pytest-results.xml

  core:
    needs: [select-runner, changes]
    if: needs.changes.outputs.core == 'true'
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs_on) }}
    outputs:
      tests: ${{ steps.test-results.outputs.tests }}
      failures: ${{ steps.test-results.outputs.failures }}
      errors: ${{ steps.test-results.outputs.errors }}
      skipped: ${{ steps.test-results.outputs.skipped }}
    defaults:
      run:
        working-directory: backend/core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: ${{ runner.environment == 'github-hosted' && 'maven' || '' }}
      # Started with docker on every runner, not as a service container, so one path serves GitHub-hosted and
      # self-hosted machines (which cannot run service containers).
      - name: Start PostgreSQL
        working-directory: .
        run: scripts/ci/start-postgres.sh postgres:16 smartledger
      - name: Verify Core with PostgreSQL tests enabled
        env:
          CORE_TEST_POSTGRES_URL: jdbc:postgresql://127.0.0.1:${{ env.PG_PORT }}/smartledger
          CORE_TEST_POSTGRES_USERNAME: smartledger
          CORE_TEST_POSTGRES_PASSWORD: smartledger
        run: bash ./mvnw --batch-mode --no-transfer-progress verify
      - name: Require PostgreSQL test execution
        run: |
          python3 scripts/test_verify_postgres_tests.py
          python3 scripts/verify_postgres_tests.py target/surefire-reports
      - name: Migrate a fresh PostgreSQL database
        working-directory: .
        run: scripts/ci/migrate-core-database.sh
      - name: Verify Core tables exist
        working-directory: .
        run: scripts/ci/check-core-tables.sh
      - name: Stop PostgreSQL
        if: always()
        working-directory: .
        run: scripts/ci/stop-postgres.sh
      - name: Capture test counts
        id: test-results
        if: always()
        working-directory: .
        run: scripts/ci/capture-test-counts.sh surefire backend/core/target/surefire-reports

  mobile-web:
    needs: [select-runner, changes]
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs_on) }}
    env:
      EXPO_PUBLIC_USE_MOCK: "true"
      EXPO_PUBLIC_MOCK_CORE: "true"
      EXPO_PUBLIC_MOCK_SHOPS: "true"
      EXPO_PUBLIC_API_ENDPOINT: http://localhost:8000
    defaults:
      run:
        working-directory: frontend/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: frontend/mobile/package-lock.json
      - name: Keep the Metro cache job-local
        # Metro caches transformed modules (with EXPO_PUBLIC_* inlined) under TMPDIR; on a shared machine
        # the mock build of mobile-web would otherwise leak into the real bundle of deploy-web.
        if: runner.environment == 'self-hosted'
        run: ../../scripts/ci/isolate-metro-cache.sh
      - run: npm ci
      - run: npm run typecheck
      - run: npm run export:web

  landing:
    needs: [select-runner, changes]
    if: needs.changes.outputs.landing == 'true'
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs_on) }}
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  container-images:
    needs: [select-runner, changes]
    if: needs.changes.outputs.containers == 'true'
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs_on) }}
    env:
      DATABASE_URL: jdbc:postgresql://ci-placeholder:5432/ci
      DATABASE_USERNAME: ci-placeholder
      DATABASE_PASSWORD: ci-placeholder
      POSTGRES_URL: postgresql://ci-placeholder:5432/ci
      FIREBASE_PROJECT_ID: ci-placeholder
      GOOGLE_APPLICATION_CREDENTIALS: ./backend/core/.env.example
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build custom service images
        run: docker compose build

  ### Report: one table of test results per run ###

  summary:
    name: CI result summary
    if: ${{ !cancelled() }}
    needs: [select-runner, docs, ai, core, mobile-web, landing, container-images]
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs_on) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci
      - name: Build compact report
        env:
          DOCS_RESULT: ${{ needs.docs.result }}
          AI_RESULT: ${{ needs.ai.result }}
          AI_TESTS: ${{ needs.ai.outputs.tests }}
          AI_FAILURES: ${{ needs.ai.outputs.failures }}
          AI_ERRORS: ${{ needs.ai.outputs.errors }}
          AI_SKIPPED: ${{ needs.ai.outputs.skipped }}
          CORE_RESULT: ${{ needs.core.result }}
          CORE_TESTS: ${{ needs.core.outputs.tests }}
          CORE_FAILURES: ${{ needs.core.outputs.failures }}
          CORE_ERRORS: ${{ needs.core.outputs.errors }}
          CORE_SKIPPED: ${{ needs.core.outputs.skipped }}
          MOBILE_RESULT: "${{ needs['mobile-web'].result }}"
          LANDING_RESULT: "${{ needs.landing.result }}"
          CONTAINER_RESULT: "${{ needs['container-images'].result }}"
        run: scripts/ci/summarize-ci.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # The summary is already in the job summary; a full artifact quota must not fail CI or skip deploys.
        continue-on-error: true
        with:
          name: ci-summary
          path: ci-summary.md
          if-no-files-found: error
          retention-days: 14

  ### Hand-off to CD: start cd.yml for the areas whose checks passed ###

  # Push to `staging` or `main` only. Each area is judged on its own checks, so a red `landing` does not hold back the
  # backend: an area deploys when it changed and its checks passed or were skipped. A re-run (`github.run_attempt > 1`)
  # hands off every area whose checks pass, so a changed environment variable can be picked up by re-running all jobs
  # (or by starting CD by hand). CD picks its own runner (CD_RUNNER, else CI_RUNNER), from this branch's cd.yml.
  cd:
    if: >-
      !cancelled() && github.event_name == 'push' && needs.changes.result == 'success'
    needs: [select-runner, changes, ai, core, mobile-web, landing, container-images]
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs_on) }}
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci
      - name: Start CD
        env:
          # A workflow_dispatch from GITHUB_TOKEN starts a new run, unlike most events it triggers.
          GH_TOKEN: ${{ github.token }}
          RERUN: ${{ github.run_attempt > 1 }}
          CHANGED_AI: ${{ needs.changes.outputs.ai }}
          CHANGED_CORE: ${{ needs.changes.outputs.core }}
          CHANGED_MOBILE: ${{ needs.changes.outputs.mobile }}
          CHANGED_LANDING: ${{ needs.changes.outputs.landing }}
          AI_RESULT: ${{ needs.ai.result }}
          CORE_RESULT: ${{ needs.core.result }}
          CONTAINERS_RESULT: ${{ needs['container-images'].result }}
          MOBILE_RESULT: ${{ needs['mobile-web'].result }}
          LANDING_RESULT: ${{ needs.landing.result }}
        run: scripts/ci/start-cd.sh
