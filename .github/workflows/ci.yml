name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/ai
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.11"
      - run: uv sync --group dev
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest

  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: bash ./mvnw --batch-mode --no-transfer-progress verify

  release-source:
    name: Release source branch
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Require staging or a hotfix branch
        env:
          BASE_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$HEAD_REPO" != "$BASE_REPO" ]]; then
            echo "::error::Release pull requests must come from a branch in $BASE_REPO."
            exit 1
          fi

          if [[ "$HEAD_BRANCH" != "staging" && "$HEAD_BRANCH" != hotfix/* ]]; then
            echo "::error::Pull requests into main must come from staging or hotfix/*; got $HEAD_BRANCH."
            exit 1
          fi
