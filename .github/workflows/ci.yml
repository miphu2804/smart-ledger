name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  ### Changes: which areas this pull request or push touched ###

  # Each test and deploy job below runs only when its area changed, so a docs-only or web-only change
  # skips the backend. A skipped job counts as passed for required checks and for the `gate` of
  # mobile-release.yml. Filtering here, not with `on.paths`, keeps every check reporting a result.
  # A change to this workflow runs everything.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ai: ${{ steps.filter.outputs.ai }}
      ai_service: ${{ steps.filter.outputs.ai_service }}
      core: ${{ steps.filter.outputs.core }}
      mobile: ${{ steps.filter.outputs.mobile }}
      landing: ${{ steps.filter.outputs.landing }}
      containers: ${{ steps.filter.outputs.containers }}
    steps:
      - uses: actions/checkout@v7
      # A pull request is compared with its base branch; a push with the commit before the push.
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          base: ${{ github.ref_name }}
          filters: |
            ai:
              - .github/workflows/ci.yml
              - backend/ai/**
              # The AI integration tests apply these migrations.
              - supabase/**
            # What the AI image ships: `backend/ai/evaluation/` is offline research that the
            # Dockerfile never copies, so a change there alone runs the AI tests but no build or deploy.
            ai_service:
              - .github/workflows/ci.yml
              - backend/ai/*
              - backend/ai/!(evaluation)/**
            core:
              - .github/workflows/ci.yml
              - backend/core/**
            mobile:
              - .github/workflows/ci.yml
              - frontend/mobile/**
            landing:
              - .github/workflows/ci.yml
              - frontend/web/**
            containers:
              - .github/workflows/ci.yml
              - compose.yaml
              - backend/ai/*
              - backend/ai/!(evaluation)/**
              - backend/core/**

  ### Test: lint, tests and builds for the areas that changed ###

  ai:
    needs: [changes]
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: smartledger_test
          POSTGRES_USER: smartledger
          POSTGRES_PASSWORD: smartledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartledger -d smartledger_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql://smartledger:smartledger@localhost:5432/smartledger_test
    outputs:
      tests: ${{ steps.test-results.outputs.tests }}
      failures: ${{ steps.test-results.outputs.failures }}
      errors: ${{ steps.test-results.outputs.errors }}
      skipped: ${{ steps.test-results.outputs.skipped }}
    defaults:
      run:
        working-directory: backend/ai
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.11"
      - run: uv sync --group dev
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest --junitxml=pytest-results.xml
      - name: Capture test counts
        id: test-results
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          from xml.etree import ElementTree

          report = Path("pytest-results.xml")
          counts = {name: "n/a" for name in ("tests", "failures", "errors", "skipped")}
          if report.exists():
              root = ElementTree.parse(report).getroot()
              suites = [root] if root.tag == "testsuite" else root.findall(".//testsuite")
              if not suites:
                  suites = [root]
              counts = {
                  name: str(sum(int(suite.get(name, "0")) for suite in suites))
                  for name in counts
              }
          for name, value in counts.items():
              print(f"{name}={value}")
          PY

  core:
    needs: [changes]
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smartledger
          POSTGRES_USER: smartledger
          POSTGRES_PASSWORD: smartledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartledger -d smartledger"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    outputs:
      tests: ${{ steps.test-results.outputs.tests }}
      failures: ${{ steps.test-results.outputs.failures }}
      errors: ${{ steps.test-results.outputs.errors }}
      skipped: ${{ steps.test-results.outputs.skipped }}
    defaults:
      run:
        working-directory: backend/core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify Core with PostgreSQL tests enabled
        env:
          CORE_TEST_POSTGRES_URL: jdbc:postgresql://127.0.0.1:5432/smartledger
          CORE_TEST_POSTGRES_USERNAME: smartledger
          CORE_TEST_POSTGRES_PASSWORD: smartledger
        run: bash ./mvnw --batch-mode --no-transfer-progress verify
      - name: Require PostgreSQL test execution
        run: |
          python3 scripts/test_verify_postgres_tests.py
          python3 scripts/verify_postgres_tests.py target/surefire-reports
      - name: Migrate a fresh PostgreSQL database
        run: |
          docker run --rm --network host \
            --volume "$GITHUB_WORKSPACE/backend/core/src/main/resources/db/migration:/flyway/sql:ro" \
            flyway/flyway:13.7.0 \
            -url=jdbc:postgresql://127.0.0.1:5432/smartledger \
            -user=smartledger \
            -password=smartledger \
            -locations=filesystem:/flyway/sql \
            -connectRetries=10 \
            migrate
      - name: Verify Core tables exist
        run: |
          table_count="$(docker run --rm --network host -e PGPASSWORD=smartledger postgres:16 \
            psql -h 127.0.0.1 -U smartledger -d smartledger -Atc \
            "SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tablename IN ('users', 'auth_identities', 'shops')")"
          test "$table_count" = "3"
      - name: Capture test counts
        id: test-results
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          from xml.etree import ElementTree

          reports = sorted(Path("target/surefire-reports").glob("TEST-*.xml"))
          totals = {name: 0 for name in ("tests", "failures", "errors", "skipped")}
          if not reports:
              totals = {name: "n/a" for name in totals}
          else:
              for report in reports:
                  suite = ElementTree.parse(report).getroot()
                  for name in totals:
                      totals[name] += int(suite.get(name, "0"))
          for name, value in totals.items():
              print(f"{name}={value}")
          PY

  mobile-web:
    needs: [changes]
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    env:
      EXPO_PUBLIC_USE_MOCK: "true"
      EXPO_PUBLIC_MOCK_CORE: "true"
      EXPO_PUBLIC_MOCK_SHOPS: "true"
      EXPO_PUBLIC_API_ENDPOINT: http://localhost:8000
    defaults:
      run:
        working-directory: frontend/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run export:web

  landing:
    needs: [changes]
    if: needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  container-images:
    needs: [changes]
    if: needs.changes.outputs.containers == 'true'
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: jdbc:postgresql://ci-placeholder:5432/ci
      DATABASE_USERNAME: ci-placeholder
      DATABASE_PASSWORD: ci-placeholder
      POSTGRES_URL: postgresql://ci-placeholder:5432/ci
      REDIS_URL: redis://ci-placeholder:6379/0
      FIREBASE_PROJECT_ID: ci-placeholder
      GOOGLE_APPLICATION_CREDENTIALS: ./backend/core/.env.example
    steps:
      - uses: actions/checkout@v7
      - name: Build custom service images
        run: docker compose build

  ### Report: one table of test results per run ###

  summary:
    name: CI result summary
    if: always()
    needs: [ai, core, mobile-web, landing, container-images]
    runs-on: ubuntu-24.04
    steps:
      - name: Build compact report
        env:
          AI_RESULT: ${{ needs.ai.result }}
          AI_TESTS: ${{ needs.ai.outputs.tests }}
          AI_FAILURES: ${{ needs.ai.outputs.failures }}
          AI_ERRORS: ${{ needs.ai.outputs.errors }}
          AI_SKIPPED: ${{ needs.ai.outputs.skipped }}
          CORE_RESULT: ${{ needs.core.result }}
          CORE_TESTS: ${{ needs.core.outputs.tests }}
          CORE_FAILURES: ${{ needs.core.outputs.failures }}
          CORE_ERRORS: ${{ needs.core.outputs.errors }}
          CORE_SKIPPED: ${{ needs.core.outputs.skipped }}
          MOBILE_RESULT: "${{ needs['mobile-web'].result }}"
          LANDING_RESULT: "${{ needs.landing.result }}"
          CONTAINER_RESULT: "${{ needs['container-images'].result }}"
        run: |
          {
            echo "# CI results"
            echo
            echo "| Suite | Result | Tests | Failures | Errors | Skipped |"
            echo "|---|---:|---:|---:|---:|---:|"
            printf '| AI (Python) | %s | %s | %s | %s | %s |\n' \
              "$AI_RESULT" "${AI_TESTS:-n/a}" "${AI_FAILURES:-n/a}" "${AI_ERRORS:-n/a}" "${AI_SKIPPED:-n/a}"
            printf '| Core (Java) | %s | %s | %s | %s | %s |\n' \
              "$CORE_RESULT" "${CORE_TESTS:-n/a}" "${CORE_FAILURES:-n/a}" "${CORE_ERRORS:-n/a}" "${CORE_SKIPPED:-n/a}"
            printf '| Mobile web | %s | n/a | n/a | n/a | n/a |\n' "$MOBILE_RESULT"
            printf '| Landing (web) | %s | n/a | n/a | n/a | n/a |\n' "$LANDING_RESULT"
            printf '| Container images | %s | n/a | n/a | n/a | n/a |\n' "$CONTAINER_RESULT"
          } > ci-summary.md
          cat ci-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: ci-summary
          path: ci-summary.md
          if-no-files-found: error
          retention-days: 14

  ### Deploy backend: Railway `ai` and `core` after a push to `staging` or `main` ###

  # Deploys backend services to Railway after a push to `staging` or `main` passes the jobs in `needs`; `landing` is not one of them.
  # Runs only when `ai` or `core` changed, and deploys only the changed service; a skipped test job
  # counts as passed, a failed or cancelled one blocks the deploy. A re-run deploys both services,
  # so a changed environment variable can be picked up by re-running all jobs.
  # Each GitHub environment holds its own environment-scoped Railway project token and branch
  # policy; `railway-production` requires approval. The environment is set on this job, not in a
  # called workflow, so its secret reaches the job.
  deploy:
    if: >-
      !failure() && !cancelled()
      && github.event_name == 'push'
      && (needs.changes.outputs.ai_service == 'true' || needs.changes.outputs.core == 'true' || github.run_attempt > 1)
    needs: [changes, ai, core, mobile-web, container-images]
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    environment: ${{ github.ref_name == 'main' && 'railway-production' || 'railway-staging' }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.63.1
      # GitHub owns the browser origins Core allows, so a manual edit on Railway cannot drift or
      # crash Core: Core refuses to start on any whitespace, wildcard or path inside an origin.
      # Skipped while the environment variable is unset, leaving the Railway value untouched.
      - name: Sync core CORS origins
        if: vars.CORS_ALLOWED_ORIGINS != ''
        env:
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
        run: |
          set -euo pipefail
          if [[ "$CORS_ALLOWED_ORIGINS" =~ [[:space:]*] ]]; then
            echo "::error::CORS_ALLOWED_ORIGINS must be comma-separated origins without spaces or wildcards"
            exit 1
          fi
          railway variable set "CORS_ALLOWED_ORIGINS=$CORS_ALLOWED_ORIGINS" --service core --skip-deploys
      # GitHub owns the AI model settings (backend/ai/.env.example), so the deploy below starts the
      # new AI with them. Each unset setting leaves its Railway value untouched.
      - name: Sync ai model settings
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER }}
          MODEL_NAME: ${{ vars.MODEL_NAME }}
          MODEL_FALLBACKS: ${{ vars.MODEL_FALLBACKS }}
          MODEL_REASONING_EFFORT: ${{ vars.MODEL_REASONING_EFFORT }}
        run: |
          set -euo pipefail
          for name in OPENAI_API_KEY OPENAI_BASE_URL MODEL_PROVIDER MODEL_NAME MODEL_FALLBACKS MODEL_REASONING_EFFORT; do
            if [[ -n "${!name}" ]]; then
              # stdin keeps the key out of the runner's process list
              printf '%s' "${!name}" | railway variable set "$name" --stdin --service ai --skip-deploys
            fi
          done
      # GitHub also owns the Logfire token (backend/ai/README.md#tracing-logfire), one per
      # environment, so it is rotated in one place. The environment name and the deployed commit
      # are derived here, so each trace shows which environment and release produced it. An unset
      # token leaves the Railway value untouched.
      - name: Sync ai tracing settings
        env:
          LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
          LOGFIRE_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
          LOGFIRE_SERVICE_VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          for name in LOGFIRE_TOKEN LOGFIRE_ENVIRONMENT LOGFIRE_SERVICE_VERSION; do
            if [[ -n "${!name}" ]]; then
              # stdin keeps the token out of the runner's process list
              printf '%s' "${!name}" | railway variable set "$name" --stdin --service ai --skip-deploys
            fi
          done
      # AI first: Core calls AI, so the new Core should not start against an old AI.
      - name: Deploy ai
        id: deploy_ai
        if: needs.changes.outputs.ai_service == 'true' || github.run_attempt > 1
        run: railway up backend/ai --path-as-root --service ai --ci
      - name: Deploy core
        id: deploy_core
        if: needs.changes.outputs.core == 'true' || github.run_attempt > 1
        run: railway up backend/core --path-as-root --service core --ci
      - name: Build deploy report
        if: always()
        env:
          AI_OUTCOME: ${{ steps.deploy_ai.outcome }}
          CORE_OUTCOME: ${{ steps.deploy_core.outcome }}
          TARGET_ENV: ${{ github.ref_name == 'main' && 'railway-production' || 'railway-staging' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "# Deploy results"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Environment | $TARGET_ENV |"
            echo "| Branch | ${GITHUB_REF_NAME} |"
            echo "| Commit | ${GITHUB_SHA::7} |"
            echo "| Triggered by | ${GITHUB_ACTOR} |"
            echo "| Run | $RUN_URL |"
            echo
            echo "| Service | Result |"
            echo "|---|---|"
            echo "| ai | $AI_OUTCOME |"
            echo "| core | $CORE_OUTCOME |"
          } > deploy-summary.md
          cat deploy-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: deploy-summary-${{ github.ref_name }}
          path: deploy-summary.md
          if-no-files-found: error
          retention-days: 14

  ### Deploy web: Vercel staging alias and production ###

  # Builds the mobile web bundle on the runner and uploads it to Vercel, so each GitHub
  # environment owns its EXPO_PUBLIC_* values (baked in at build time) and Vercel token.
  # `staging` gets a fixed alias and `main` goes to production; pull requests get no preview.
  # Vercel's own Git deployments are off in frontend/mobile/vercel.json to avoid double deploys.
  deploy-web:
    # Push only: pull-request previews used up the Vercel Hobby limit of 100 deployments a day and
    # blocked the staging and production deploys. The PR-only steps below stay so previews can
    # return with `|| github.event.pull_request.head.repo.full_name == github.repository`.
    # A re-run always deploys, as in deploy-landing.
    if: >-
      !failure() && !cancelled() && github.event_name == 'push'
      && (needs.changes.outputs.mobile == 'true' || github.run_attempt > 1)
    needs: [changes, mobile-web]
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-24.04
    # `url` links the GitHub Deployments sidebar to the fixed domains; previews get none because
    # their alias depends on the PR number and is already commented on the PR.
    environment:
      name: ${{ github.event_name == 'pull_request' && 'vercel-preview' || (github.ref_name == 'main' && 'vercel-production' || 'vercel-staging') }}
      url: ${{ github.event_name == 'pull_request' && '' || (github.ref_name == 'main' && 'https://smart-ledger-prod.vercel.app' || 'https://smart-ledger-staging.vercel.app') }}
    concurrency:
      group: deploy-web-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    # Vercel CLI runs from the repo root: the project's Root Directory setting already points at frontend/mobile.
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TARGET: ${{ github.ref_name == 'main' && github.event_name == 'push' && 'production' || 'preview' }}
      EXPO_PUBLIC_USE_MOCK: ${{ vars.EXPO_PUBLIC_USE_MOCK }}
      EXPO_PUBLIC_MOCK_CORE: ${{ vars.EXPO_PUBLIC_MOCK_CORE }}
      EXPO_PUBLIC_MOCK_SHOPS: ${{ vars.EXPO_PUBLIC_MOCK_SHOPS }}
      EXPO_PUBLIC_API_ENDPOINT: ${{ vars.EXPO_PUBLIC_API_ENDPOINT }}
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID }}
      # Nút Zalo trên web; chỉ đặt "true" khi Core của môi trường đã bật Zalo và nhận origin của trang này
      EXPO_PUBLIC_ZALO_LOGIN: ${{ vars.EXPO_PUBLIC_ZALO_LOGIN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/mobile/package-lock.json
      - name: Install Vercel CLI
        run: npm install --global vercel@62.2.0
      - run: vercel pull --yes --environment="$VERCEL_TARGET" --token="$VERCEL_TOKEN"
      # Job env wins over values pulled from Vercel, so GitHub stays the source of EXPO_PUBLIC_*.
      - run: vercel build ${{ env.VERCEL_TARGET == 'production' && '--prod' || '' }} --token="$VERCEL_TOKEN"
      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ env.VERCEL_TARGET == 'production' && '--prod' || '' }} --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # A per-deploy URL carries a random hash, so Core CORS and Firebase cannot list it. Each PR
      # takes the fixed alias of its number's last digit (00-09); PRs sharing a digit overwrite
      # each other, and re-running the job takes the slot back.
      - name: Alias preview
        id: preview
        if: github.event_name == 'pull_request'
        env:
          URL: ${{ steps.deploy.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          alias="smart-ledger-preview-0$((PR % 10)).vercel.app"
          api=https://api.vercel.com
          auth="Authorization: Bearer $VERCEL_TOKEN"
          id=$(curl -fsS -H "$auth" "$api/v13/deployments/${URL#https://}?teamId=$VERCEL_ORG_ID" | jq -r .id)
          curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" \
            -d "$(jq -n --arg alias "$alias" '{alias: $alias}')" \
            "$api/v2/deployments/$id/aliases?teamId=$VERCEL_ORG_ID"
          echo "url=https://$alias" >> "$GITHUB_OUTPUT"
          echo "alias: https://$alias -> $URL"
      # Runs before the smoke test so the test checks the fixed alias that Core CORS lists,
      # not the per-deploy hash URL.
      - name: Alias staging
        id: staging
        if: github.event_name == 'push' && github.ref_name == 'staging'
        env:
          STAGING_ALIAS: ${{ vars.VERCEL_STAGING_ALIAS }}
          URL: ${{ steps.deploy.outputs.url }}
        # Calls the REST API directly: `vercel alias set` first loads the token's user, which
        # fails with "User not found" for this team token even though deploys succeed.
        run: |
          set -euo pipefail
          api=https://api.vercel.com
          auth="Authorization: Bearer $VERCEL_TOKEN"
          id=$(curl -fsS -H "$auth" "$api/v13/deployments/${URL#https://}?teamId=$VERCEL_ORG_ID" | jq -r .id)
          curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" \
            -d "$(jq -n --arg alias "$STAGING_ALIAS" '{alias: $alias}')" \
            "$api/v2/deployments/$id/aliases?teamId=$VERCEL_ORG_ID"
          echo "url=https://$STAGING_ALIAS" >> "$GITHUB_OUTPUT"
          echo "alias: https://$STAGING_ALIAS -> $URL"
      # `main` is checked at the fixed production domain, the only origin Core CORS lists; the
      # per-deploy hash URL is never allowed.
      # Fails the job when the deployed web would not reach Core: page down, env not baked in,
      # or Core rejecting this origin's CORS preflight.
      - name: Smoke test
        env:
          URL: ${{ steps.preview.outputs.url || steps.staging.outputs.url || (github.ref_name == 'main' && 'https://smart-ledger-prod.vercel.app') || steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          # A fresh alias can take a few seconds to route, so retry before failing.
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/")
            [ "$code" = 200 ] && break
            sleep 5
          done
          test "$code" = 200
          echo "page: 200"
          if [ "$EXPO_PUBLIC_USE_MOCK" = "true" ]; then echo "mock build, skipping Core checks"; exit 0; fi
          grep -rqF "$EXPO_PUBLIC_API_ENDPOINT" .vercel/output/static
          echo "bundle: API endpoint baked in"
          allow=$(curl -s -o /dev/null -D - -X OPTIONS "$EXPO_PUBLIC_API_ENDPOINT/api/v1/auth/session" \
            -H "Origin: $URL" -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: authorization,content-type" \
            | tr -d '\r' | awk -F': ' 'tolower($1)=="access-control-allow-origin"{print $2}')
          if [ "$allow" != "$URL" ]; then echo "::error::Core CORS does not allow $URL"; exit 1; fi
          echo "cors: Core allows $URL"
      - name: Report URL
        if: always() && steps.deploy.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.preview.outputs.url || steps.staging.outputs.url || (github.ref_name == 'main' && 'https://smart-ledger-prod.vercel.app') || steps.deploy.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          echo "Web deploy: $URL" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PR" ]; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none \
              --body "Web preview (commit ${GITHUB_SHA::7}): $URL"
          fi

  ### Deploy landing: Vercel project `landing`, staging alias and production ###

  # Same shape as deploy-web, with its own Vercel project and GitHub environments. Vercel's Git
  # deployments are off in frontend/web/vercel.json, so only this job deploys the landing.
  # Pull requests get no preview (see deploy-web). When previews return, each PR gets the alias
  # smart-ledger-landing-pr-<number> in the run summary and no PR comment, because deploy-web
  # already edits the bot's last PR comment.
  deploy-landing:
    # Push only, like deploy-web, and only when the landing changed. A re-run always deploys, so a
    # changed environment variable can be picked up by re-running all jobs; `landing` is then
    # skipped, so a skipped need must not block this job.
    if: >-
      !failure() && !cancelled() && github.event_name == 'push'
      && (needs.changes.outputs.landing == 'true' || github.run_attempt > 1)
    needs: [changes, landing]
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    environment: ${{ github.event_name == 'pull_request' && 'landing-preview' || (github.ref_name == 'main' && 'landing-production' || 'landing-staging') }}
    concurrency:
      group: deploy-landing-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TARGET: ${{ github.ref_name == 'main' && github.event_name == 'push' && 'production' || 'preview' }}
      VITE_LEGAL_DRAFT: ${{ vars.VITE_LEGAL_DRAFT }}
      VITE_ANDROID_APK_URL: ${{ vars.VITE_ANDROID_APK_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - name: Install Vercel CLI
        run: npm install --global vercel@62.2.0
      - run: vercel pull --yes --environment="$VERCEL_TARGET" --token="$VERCEL_TOKEN"
      - run: vercel build ${{ env.VERCEL_TARGET == 'production' && '--prod' || '' }} --token="$VERCEL_TOKEN"
      # Vercel project variables are pulled into the build, so a VITE_ADMIN_ENABLED=true set there would publish admin.
      - name: Check no admin code in the build
        run: |
          # The chunk name follows the lazy import in App.tsx; admin123 is a mock password and may change.
          if [ -n "$(find .vercel/output/static -name 'AdminRoutes-*')" ] || grep -rqF admin123 .vercel/output/static; then
            echo "::error::admin code is in the landing build; remove VITE_ADMIN_ENABLED from the Vercel project"
            exit 1
          fi
      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ env.VERCEL_TARGET == 'production' && '--prod' || '' }} --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # REST alias, as in deploy-web: `vercel alias set` fails for team tokens.
      - name: Alias preview
        id: preview
        if: github.event_name == 'pull_request'
        env:
          URL: ${{ steps.deploy.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          alias="smart-ledger-landing-pr-$PR.vercel.app"
          api=https://api.vercel.com
          auth="Authorization: Bearer $VERCEL_TOKEN"
          id=$(curl -fsS -H "$auth" "$api/v13/deployments/${URL#https://}?teamId=$VERCEL_ORG_ID" | jq -r .id)
          curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" \
            -d "$(jq -n --arg alias "$alias" '{alias: $alias}')" \
            "$api/v2/deployments/$id/aliases?teamId=$VERCEL_ORG_ID"
          echo "url=https://$alias" >> "$GITHUB_OUTPUT"
          echo "alias: https://$alias -> $URL"
      - name: Alias staging
        if: github.event_name == 'push' && github.ref_name == 'staging'
        env:
          URL: ${{ steps.deploy.outputs.url }}
          STAGING_URL: ${{ vars.LANDING_URL }}
        run: |
          set -euo pipefail
          test -n "$STAGING_URL" || { echo "::error::LANDING_URL is not set on landing-staging"; exit 1; }
          alias="${STAGING_URL#https://}"
          api=https://api.vercel.com
          auth="Authorization: Bearer $VERCEL_TOKEN"
          id=$(curl -fsS -H "$auth" "$api/v13/deployments/${URL#https://}?teamId=$VERCEL_ORG_ID" | jq -r .id)
          curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" \
            -d "$(jq -n --arg alias "$alias" '{alias: $alias}')" \
            "$api/v2/deployments/$id/aliases?teamId=$VERCEL_ORG_ID"
          echo "alias: $STAGING_URL -> $URL"
      # Pull requests check their PR alias; staging and main check the fixed LANDING_URL.
      - name: Smoke test
        env:
          URL: ${{ github.event_name == 'pull_request' && steps.preview.outputs.url || vars.LANDING_URL }}
        run: |
          set -euo pipefail
          test -n "$URL" || { echo "::error::LANDING_URL is not set for this environment"; exit 1; }
          # A fresh alias can take a few seconds to route, so retry before failing.
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/" || true)
            [ "$code" = 200 ] && break
            sleep 5
          done
          test "$code" = 200
          echo "page: 200 at $URL"
      - name: Report URL
        if: always() && steps.deploy.outputs.url != ''
        env:
          URL: ${{ steps.preview.outputs.url || steps.deploy.outputs.url }}
        run: |
          echo "Landing deploy: $URL" >> "$GITHUB_STEP_SUMMARY"

  ### Deploy admin: a separate Vercel project built from frontend/web with the admin enabled ###
  # Same source as the landing, but VITE_ADMIN_ENABLED=true and real Core data, so the public landing never
  # carries admin code. It reuses the landing-* environments (same Vercel team token and production approval)
  # with its own project and ADMIN_* variables. Until those are set the job only prints a notice.
  deploy-admin:
    if: >-
      !failure() && !cancelled() && github.event_name == 'push'
      && (github.ref_name == 'staging' || github.ref_name == 'main')
      && (needs.changes.outputs.landing == 'true' || github.run_attempt > 1)
    needs: [changes, landing]
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    environment: ${{ github.ref_name == 'main' && 'landing-production' || 'landing-staging' }}
    concurrency:
      group: deploy-admin-${{ github.ref_name }}
      cancel-in-progress: true
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.ADMIN_VERCEL_PROJECT_ID }}
      VERCEL_TARGET: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      VITE_ADMIN_ENABLED: "true"
      VITE_USE_MOCK: "false"
      VITE_API_ENDPOINT: ${{ vars.ADMIN_API_ENDPOINT }}
      VITE_FIREBASE_API_KEY: ${{ vars.ADMIN_FIREBASE_API_KEY }}
      ADMIN_URL: ${{ vars.ADMIN_URL }}
    steps:
      - name: Check the environment is set up
        id: ready
        run: |
          missing=""
          # Names as set on the environment (the job maps the ADMIN_* variables to VITE_* for the build)
          check() { [ -n "$2" ] || missing="$missing $1"; }
          check VERCEL_TOKEN "$VERCEL_TOKEN"
          check VERCEL_ORG_ID "$VERCEL_ORG_ID"
          check ADMIN_VERCEL_PROJECT_ID "$VERCEL_PROJECT_ID"
          check ADMIN_API_ENDPOINT "$VITE_API_ENDPOINT"
          check ADMIN_FIREBASE_API_KEY "$VITE_FIREBASE_API_KEY"
          check ADMIN_URL "$ADMIN_URL"
          if [ -n "$missing" ]; then
            echo "::notice::Admin deploy skipped: set$missing on the ${{ github.ref_name == 'main' && 'landing-production' || 'landing-staging' }} environment"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.ready.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: steps.ready.outputs.ready == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - name: Install Vercel CLI
        if: steps.ready.outputs.ready == 'true'
        run: npm install --global vercel@62.2.0
      - if: steps.ready.outputs.ready == 'true'
        run: vercel pull --yes --environment="$VERCEL_TARGET" --token="$VERCEL_TOKEN"
      - if: steps.ready.outputs.ready == 'true'
        run: vercel build ${{ env.VERCEL_TARGET == 'production' && '--prod' || '' }} --token="$VERCEL_TOKEN"
      # The admin must be the real one: admin routes present, no mock demo accounts, pointed at this Core.
      - name: Check the admin build
        if: steps.ready.outputs.ready == 'true'
        run: |
          out=.vercel/output/static
          [ -n "$(find "$out" -name 'AdminRoutes-*')" ] || { echo "::error::admin routes are missing; VITE_ADMIN_ENABLED did not reach the build"; exit 1; }
          if grep -rqF admin123 "$out"; then echo "::error::mock demo accounts are in the admin build; VITE_USE_MOCK must be false"; exit 1; fi
          grep -rqF "$VITE_API_ENDPOINT" "$out" || { echo "::error::the build does not point at ADMIN_API_ENDPOINT"; exit 1; }
      - name: Deploy
        id: deploy
        if: steps.ready.outputs.ready == 'true'
        run: |
          url=$(vercel deploy --prebuilt ${{ env.VERCEL_TARGET == 'production' && '--prod' || '' }} --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # Staging deploys are previews; give them the fixed ADMIN_URL alias. Production uses the project's domain.
      - name: Alias staging
        if: steps.ready.outputs.ready == 'true' && github.ref_name == 'staging'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          alias="${ADMIN_URL#https://}"
          api=https://api.vercel.com
          auth="Authorization: Bearer $VERCEL_TOKEN"
          id=$(curl -fsS -H "$auth" "$api/v13/deployments/${URL#https://}?teamId=$VERCEL_ORG_ID" | jq -r .id)
          curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" \
            -d "$(jq -n --arg alias "$alias" '{alias: $alias}')" \
            "$api/v2/deployments/$id/aliases?teamId=$VERCEL_ORG_ID"
          echo "alias: $ADMIN_URL -> $URL"
      - name: Smoke test
        if: steps.ready.outputs.ready == 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$ADMIN_URL/admin/login" || true)
            [ "$code" = 200 ] && break
            sleep 5
          done
          test "$code" = 200
          echo "admin login page: 200 at $ADMIN_URL/admin/login" >> "$GITHUB_STEP_SUMMARY"
