name: CI

# Tests and builds, then the deploy workflows (cd-*.yml) as called jobs, so each deploy keeps its `needs` gate, the
# pushed branch as ref and its environment rules. Run it by hand (Actions tab, or `gh workflow run ci.yml --ref staging`)
# to test and redeploy everything on `staging` or `main` without a new commit.
on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

# A new commit on a pull request cancels the run of the previous one. Other runs get their own group: they carry
# deploys, and a shared group would also make the tests of one push wait for the deploy of the one before.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ### Changes: which parts of the repository this run touches ###

  # Test and deploy jobs run only for the parts that changed. A job skipped by its `if` still counts as passed for
  # the required checks, which a workflow-level `paths` filter would leave pending.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ai: ${{ steps.filter.outputs.ai }}
      core: ${{ steps.filter.outputs.core }}
      mobile: ${{ steps.filter.outputs.mobile }}
      landing: ${{ steps.filter.outputs.landing }}
      images: ${{ steps.filter.outputs.images }}
      backend: ${{ steps.filter.outputs.backend }}
      stt: ${{ steps.filter.outputs.stt }}
    steps:
      # Full history without file contents: enough to list changed paths, and fast.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - name: List changed parts
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only --no-renames "$BASE" HEAD)
          else
            # No base commit (manual run, first push of a branch): treat everything as changed.
            files=.github/workflows/ci.yml
          fi
          echo "$files"
          # A change to the workflows themselves runs every job.
          changed() { grep -qE "^\.github/workflows/(ci|cd-[a-z]+)\.yml$|$1" <<< "$files" && echo true || echo false; }
          {
            # The AI tests apply the AI baseline from supabase/migrations.
            echo "ai=$(changed '^backend/ai/|^supabase/migrations/')"
            echo "core=$(changed '^backend/core/')"
            echo "mobile=$(changed '^frontend/mobile/')"
            echo "landing=$(changed '^frontend/web/')"
            echo "images=$(changed '^backend/(ai|core)/|^compose\.yaml$')"
            # The deploy ships service code only; CI does not run migrations, so they alone do not redeploy.
            echo "backend=$(changed '^backend/(ai|core)/')"
            # The speech model's version and file sizes, and the script that uploads it to R2 at release time.
            echo "stt=$(changed '^frontend/mobile/src/lib/speech/core\.ts$|^\.github/scripts/stt-model\.mjs$')"
          } | tee -a "$GITHUB_OUTPUT"

  ### Test: lint, tests and builds for the parts that changed ###

  ai:
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: smartledger_test
          POSTGRES_USER: smartledger
          POSTGRES_PASSWORD: smartledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartledger -d smartledger_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql://smartledger:smartledger@localhost:5432/smartledger_test
    outputs:
      tests: ${{ steps.test-results.outputs.tests }}
      failures: ${{ steps.test-results.outputs.failures }}
      errors: ${{ steps.test-results.outputs.errors }}
      skipped: ${{ steps.test-results.outputs.skipped }}
    defaults:
      run:
        working-directory: backend/ai
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.11"
      - run: uv sync --group dev
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest --junitxml=pytest-results.xml
      - name: Capture test counts
        id: test-results
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          from xml.etree import ElementTree

          report = Path("pytest-results.xml")
          counts = {name: "n/a" for name in ("tests", "failures", "errors", "skipped")}
          if report.exists():
              root = ElementTree.parse(report).getroot()
              suites = [root] if root.tag == "testsuite" else root.findall(".//testsuite")
              if not suites:
                  suites = [root]
              counts = {
                  name: str(sum(int(suite.get(name, "0")) for suite in suites))
                  for name in counts
              }
          for name, value in counts.items():
              print(f"{name}={value}")
          PY
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ai-test-report
          path: backend/ai/pytest-results.xml
          if-no-files-found: ignore
          retention-days: 7

  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smartledger
          POSTGRES_USER: smartledger
          POSTGRES_PASSWORD: smartledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartledger -d smartledger"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    outputs:
      tests: ${{ steps.test-results.outputs.tests }}
      failures: ${{ steps.test-results.outputs.failures }}
      errors: ${{ steps.test-results.outputs.errors }}
      skipped: ${{ steps.test-results.outputs.skipped }}
    defaults:
      run:
        working-directory: backend/core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify Core with PostgreSQL tests enabled
        env:
          CORE_TEST_POSTGRES_URL: jdbc:postgresql://127.0.0.1:5432/smartledger
          CORE_TEST_POSTGRES_USERNAME: smartledger
          CORE_TEST_POSTGRES_PASSWORD: smartledger
        run: bash ./mvnw --batch-mode --no-transfer-progress verify
      - name: Require PostgreSQL test execution
        run: |
          python3 scripts/test_verify_postgres_tests.py
          python3 scripts/verify_postgres_tests.py target/surefire-reports
      - name: Migrate a fresh PostgreSQL database
        run: |
          docker run --rm --network host \
            --volume "$GITHUB_WORKSPACE/backend/core/src/main/resources/db/migration:/flyway/sql:ro" \
            flyway/flyway:13.7.0 \
            -url=jdbc:postgresql://127.0.0.1:5432/smartledger \
            -user=smartledger \
            -password=smartledger \
            -locations=filesystem:/flyway/sql \
            -connectRetries=10 \
            migrate
      - name: Verify Core tables exist
        run: |
          table_count="$(docker run --rm --network host -e PGPASSWORD=smartledger postgres:16 \
            psql -h 127.0.0.1 -U smartledger -d smartledger -Atc \
            "SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tablename IN ('users', 'auth_identities', 'shops')")"
          test "$table_count" = "3"
      - name: Capture test counts
        id: test-results
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          from xml.etree import ElementTree

          reports = sorted(Path("target/surefire-reports").glob("TEST-*.xml"))
          totals = {name: 0 for name in ("tests", "failures", "errors", "skipped")}
          if not reports:
              totals = {name: "n/a" for name in totals}
          else:
              for report in reports:
                  suite = ElementTree.parse(report).getroot()
                  for name in totals:
                      totals[name] += int(suite.get(name, "0"))
          for name, value in totals.items():
              print(f"{name}={value}")
          PY
      # Surefire keeps the full stack traces and captured output that the Maven console cuts short.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: core-test-report
          path: backend/core/target/surefire-reports
          if-no-files-found: ignore
          retention-days: 7

  mobile-web:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPO_PUBLIC_USE_MOCK: "true"
      EXPO_PUBLIC_MOCK_CORE: "true"
      EXPO_PUBLIC_MOCK_SHOPS: "true"
      EXPO_PUBLIC_API_ENDPOINT: http://localhost:8000
    defaults:
      run:
        working-directory: frontend/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run export:web

  # The release build uploads the speech model from HuggingFace to R2 only when it publishes to production, and fails
  # there if core.ts no longer matches the pinned source. Fetching it here moves that failure to the pull request.
  stt-model:
    needs: changes
    if: needs.changes.outputs.stt == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Check the speech model source against core.ts
        run: node .github/scripts/stt-model.mjs fetch "$RUNNER_TEMP/stt-model"

  landing:
    needs: changes
    if: needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  container-images:
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: jdbc:postgresql://ci-placeholder:5432/ci
      DATABASE_USERNAME: ci-placeholder
      DATABASE_PASSWORD: ci-placeholder
      POSTGRES_URL: postgresql://ci-placeholder:5432/ci
      REDIS_URL: redis://ci-placeholder:6379/0
      FIREBASE_PROJECT_ID: ci-placeholder
      GOOGLE_APPLICATION_CREDENTIALS: ./backend/core/.env.example
    steps:
      - uses: actions/checkout@v7
      - name: Build custom service images
        run: docker compose build

  ### Report: one table of test results per run, and the gate for the required checks ###

  # A failed `changes` skips every test job, and a skipped job passes a required check, so this job is required too
  # and fails when `changes`, a required test job or `stt-model` did not pass. `landing` is reported but, as before, not required.
  summary:
    name: CI result summary
    if: always()
    needs: [changes, ai, core, mobile-web, stt-model, landing, container-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Build compact report
        env:
          AI_RESULT: ${{ needs.ai.result }}
          AI_TESTS: ${{ needs.ai.outputs.tests }}
          AI_FAILURES: ${{ needs.ai.outputs.failures }}
          AI_ERRORS: ${{ needs.ai.outputs.errors }}
          AI_SKIPPED: ${{ needs.ai.outputs.skipped }}
          CORE_RESULT: ${{ needs.core.result }}
          CORE_TESTS: ${{ needs.core.outputs.tests }}
          CORE_FAILURES: ${{ needs.core.outputs.failures }}
          CORE_ERRORS: ${{ needs.core.outputs.errors }}
          CORE_SKIPPED: ${{ needs.core.outputs.skipped }}
          MOBILE_RESULT: "${{ needs['mobile-web'].result }}"
          STT_RESULT: "${{ needs['stt-model'].result }}"
          LANDING_RESULT: "${{ needs.landing.result }}"
          CONTAINER_RESULT: "${{ needs['container-images'].result }}"
        run: |
          {
            echo "# CI results"
            echo
            echo "| Suite | Result | Tests | Failures | Errors | Skipped |"
            echo "|---|---:|---:|---:|---:|---:|"
            printf '| AI (Python) | %s | %s | %s | %s | %s |\n' \
              "$AI_RESULT" "${AI_TESTS:-n/a}" "${AI_FAILURES:-n/a}" "${AI_ERRORS:-n/a}" "${AI_SKIPPED:-n/a}"
            printf '| Core (Java) | %s | %s | %s | %s | %s |\n' \
              "$CORE_RESULT" "${CORE_TESTS:-n/a}" "${CORE_FAILURES:-n/a}" "${CORE_ERRORS:-n/a}" "${CORE_SKIPPED:-n/a}"
            printf '| Mobile web | %s | n/a | n/a | n/a | n/a |\n' "$MOBILE_RESULT"
            printf '| Speech model source | %s | n/a | n/a | n/a | n/a |\n' "$STT_RESULT"
            printf '| Landing (web) | %s | n/a | n/a | n/a | n/a |\n' "$LANDING_RESULT"
            printf '| Container images | %s | n/a | n/a | n/a | n/a |\n' "$CONTAINER_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail when a required job did not pass
        if: >-
          needs.changes.result != 'success'
          || contains(fromJSON('["failure", "cancelled"]'), needs.ai.result)
          || contains(fromJSON('["failure", "cancelled"]'), needs.core.result)
          || contains(fromJSON('["failure", "cancelled"]'), needs['mobile-web'].result)
          || contains(fromJSON('["failure", "cancelled"]'), needs['container-images'].result)
          || contains(fromJSON('["failure", "cancelled"]'), needs['stt-model'].result)
        run: |
          echo "::error::changes, ai, core, mobile-web, container-images or stt-model did not pass; see the table above"
          exit 1

  ### Deploy: one called workflow per target, each behind the test jobs it depends on ###

  # A skipped test job means its part did not change, so these jobs check results instead of the default `success()`,
  # which would skip the deploy too. `secrets: inherit` is what lets a called job read its environment's secrets.

  # Railway `ai` and `core`, after a push to `staging` or `main` that changed the backend. A red `landing` does not
  # hold it back.
  deploy:
    needs: [changes, ai, core, mobile-web, container-images]
    if: >-
      !cancelled() && github.event_name != 'pull_request'
      && needs.changes.outputs.backend == 'true'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    permissions:
      contents: read
    uses: ./.github/workflows/cd-backend.yml
    secrets: inherit

  # Mobile web on Vercel. Pull requests from forks get no secrets, so no preview.
  deploy-web:
    needs: [mobile-web]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/cd-web.yml
    secrets: inherit

  # Landing page on Vercel.
  deploy-landing:
    needs: [landing]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    uses: ./.github/workflows/cd-landing.yml
    secrets: inherit
