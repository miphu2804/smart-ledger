name: Deploy backend

# Called by cd.yml for a commit of `staging` or `main` whose `ai`, `core` and `container-images` passed. It builds the
# `ai` and `core` images, pushes them to GitHub Container Registry (GHCR) and runs deploy/vps/deploy.sh on the VPS over SSH. Kept apart from
# the tests so a change here cannot break a required check, and so the backend deploy waits only for the backend jobs.
# See docs/development/ci-cd.md#vps.
# Each GitHub environment holds its own VPS address, SSH key and settings, plus its branch policy;
# `backend-production` requires approval. The environment is set on the job below, so its secrets reach the job
# without the caller passing them.

on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON for `runs-on`, from select-runner.yml
        type: string
        required: true
      sha:
        description: Commit to deploy; CI tested it
        type: string
        required: true
      ai:
        description: Deploy service `ai`
        type: boolean
        required: true
      core:
        description: Deploy service `core`
        type: boolean
        required: true

permissions:
  contents: read
  # cd.yml's calling job grants packages: write; a reusable workflow can only maintain or reduce the
  # caller's grant, and this block was reducing it away, so the first GHCR push failed with
  # "denied: installation not allowed to Create organization package".
  packages: write

jobs:
  deploy:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    environment: ${{ github.ref_name == 'main' && 'backend-production' || 'backend-staging' }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      # One GHCR package per service and environment, tagged by commit, so staging deploys never push a production
      # image out of its rollback window. Image names must be lowercase, which this repository's owner and name are.
      DEPLOY_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      AI_IMAGE: ghcr.io/${{ github.repository }}-ai-${{ github.ref_name == 'main' && 'production' || 'staging' }}:${{ inputs.sha }}
      CORE_IMAGE: ghcr.io/${{ github.repository }}-core-${{ github.ref_name == 'main' && 'production' || 'staging' }}:${{ inputs.sha }}
      # Rollback window per environment (docs/development/ci-cd.md#vps): production releases are rare, staging deploys
      # several times a day and rarely rolls back far.
      KEEP_IMAGES: ${{ github.ref_name == 'main' && 20 || 10 }}
      # The label links each package to this repository, which lets this job's GITHUB_TOKEN push and delete its versions.
      IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
      APP_DIR: ${{ vars.VPS_APP_DIR || '/opt/smartledger' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      # On the self-hosted machine the Docker and SSH clients would otherwise read and write the owner's
      # ~/.docker and ~/.ssh; these job-local paths keep the owner's logins, keys and known hosts untouched.
      - name: Isolate the Docker and SSH config
        run: |
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
          echo "SSH_CONFIG=$RUNNER_TEMP/ssh/config" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$DOCKER_CONFIG"
          # Docker Desktop keeps buildx under ~/.docker/cli-plugins, which the job-local DOCKER_CONFIG hides.
          if [ -d "$HOME/.docker/cli-plugins" ]; then
            ln -sfn "$HOME/.docker/cli-plugins" "$DOCKER_CONFIG/cli-plugins"
          fi
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      # The VPS is linux/amd64 while a self-hosted machine may be arm64, so every image names its platform.
      # Without provenance each push is one tagged version, so the cleanup counts only deployable images.
      - name: Build and push ai
        if: inputs.ai
        run: |
          docker buildx build --platform linux/amd64 --provenance=false --label "org.opencontainers.image.source=$IMAGE_SOURCE" \
            --tag "$AI_IMAGE" --push backend/ai
      # The runner builds the jar and the image only wraps it in a JRE, so the image build needs no Maven.
      - uses: actions/setup-java@v6
        if: inputs.core
        with:
          distribution: temurin
          java-version: "21"
      - name: Build and push core
        if: inputs.core
        working-directory: backend/core
        run: |
          set -euo pipefail
          bash ./mvnw --batch-mode --no-transfer-progress -DskipTests package
          mkdir -p "$RUNNER_TEMP/core-prebuilt"
          cp target/core-0.0.1-SNAPSHOT.jar "$RUNNER_TEMP/core-prebuilt/app.jar"
          docker buildx build --platform linux/amd64 --provenance=false --label "org.opencontainers.image.source=$IMAGE_SOURCE" \
            --file Dockerfile.prebuilt --tag "$CORE_IMAGE" --push "$RUNNER_TEMP/core-prebuilt"
      # The private key lives only in a job-local ssh-agent; the known_hosts secret pins the VPS host key, so a
      # spoofed server is refused instead of trusted on first use.
      - name: Start ssh-agent
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER || 'deploy' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ssh" && chmod 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          cat > "$SSH_CONFIG" <<EOF
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            UserKnownHostsFile $RUNNER_TEMP/ssh/known_hosts
            StrictHostKeyChecking yes
            BatchMode yes
          EOF
          eval "$(ssh-agent -s)"
          # Stored base64 on one line, so it fits the one-line env files of scripts/secrets (.env.vps).
          printf '%s' "$VPS_SSH_KEY" | base64 -d | ssh-add -
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
      # GitHub owns the browser origins Core allows, so a manual edit on the VPS cannot drift or crash Core: Core
      # refuses to start on any whitespace, wildcard or path inside an origin. Unset leaves the VPS core.env value.
      - name: Upload core settings
        if: inputs.core
        env:
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
        run: |
          set -euo pipefail
          if [[ "$CORS_ALLOWED_ORIGINS" =~ [[:space:]*] ]]; then
            echo "::error::CORS_ALLOWED_ORIGINS must be comma-separated origins without spaces or wildcards"
            exit 1
          fi
          {
            if [ -n "$CORS_ALLOWED_ORIGINS" ]; then echo "CORS_ALLOWED_ORIGINS=$CORS_ALLOWED_ORIGINS"; fi
          } | ssh -F "$SSH_CONFIG" vps "umask 077 && cat > '$APP_DIR/github.core.env'"
      # GitHub also owns the AI model settings (backend/ai/.env.example) and the Logfire token
      # (backend/ai/README.md#tracing-logfire). The file goes over stdin, so no value shows in a process list.
      # Each unset setting leaves its VPS ai.env value.
      - name: Upload ai settings
        if: inputs.ai
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER }}
          MODEL_NAME: ${{ vars.MODEL_NAME }}
          MODEL_FALLBACKS: ${{ vars.MODEL_FALLBACKS }}
          MODEL_REASONING_EFFORT: ${{ vars.MODEL_REASONING_EFFORT }}
          LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
          LOGFIRE_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
          LOGFIRE_SERVICE_VERSION: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          for name in OPENAI_API_KEY OPENAI_BASE_URL MODEL_PROVIDER MODEL_NAME MODEL_FALLBACKS MODEL_REASONING_EFFORT \
            LOGFIRE_TOKEN LOGFIRE_ENVIRONMENT LOGFIRE_SERVICE_VERSION; do
            if [[ -n "${!name}" ]]; then printf '%s=%s\n' "$name" "${!name}"; fi
          done | ssh -F "$SSH_CONFIG" vps "umask 077 && cat > '$APP_DIR/github.ai.env'"
      - name: Deploy
        id: deploy
        env:
          DEPLOY_AI_IMAGE: ${{ inputs.ai && env.AI_IMAGE || '' }}
          DEPLOY_CORE_IMAGE: ${{ inputs.core && env.CORE_IMAGE || '' }}
        run: |
          ssh -F "$SSH_CONFIG" vps \
            "APP_DIR='$APP_DIR' ENVIRONMENT='$DEPLOY_ENV' AI_IMAGE='$DEPLOY_AI_IMAGE' CORE_IMAGE='$DEPLOY_CORE_IMAGE' bash -s" \
            < deploy/vps/deploy.sh
      # Keeps the KEEP_IMAGES latest versions of this environment's packages, newest first by creation, so the
      # running image is never the one removed. A plain REST call with the job's own GITHUB_TOKEN, which the source
      # label's repository link already authorizes: actions/delete-package-versions@v5 crashes on macOS runners
      # (TypeError in macosRelease, actions/delete-package-versions#196) and the self-hosted runner is macOS.
      - name: Delete old images
        if: inputs.ai || inputs.core
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          DEPLOY_ENV: ${{ env.DEPLOY_ENV }}
          KEEP_IMAGES: ${{ env.KEEP_IMAGES }}
        run: |
          services=""
          [ "${{ inputs.ai }}" = true ] && services="$services ai"
          [ "${{ inputs.core }}" = true ] && services="$services core"
          for service in $services; do
            package="$REPO-$service-$DEPLOY_ENV"
            ids=$(gh api --paginate "users/$OWNER/packages/container/$package/versions" \
              -q "sort_by(.created_at) | reverse | .[$KEEP_IMAGES:] | .[].id")
            if [ -n "$ids" ]; then
              for id in $ids; do
                gh api -X DELETE "users/$OWNER/packages/container/$package/versions/$id"
                echo "Deleted $package version $id"
              done
            else
              kept=$(gh api "users/$OWNER/packages/container/$package/versions" -q 'length')
              echo "$package: $kept version(s), none beyond the keep window"
            fi
          done
      - name: Stop ssh-agent and log out
        if: always()
        run: |
          if [ -n "${SSH_AGENT_PID:-}" ]; then ssh-agent -k; fi
          docker logout ghcr.io || true
          rm -rf "$RUNNER_TEMP/ssh" "$DOCKER_CONFIG"
      - name: Build deploy report
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          AI: ${{ inputs.ai }}
          CORE: ${{ inputs.core }}
          TARGET_ENV: ${{ github.ref_name == 'main' && 'backend-production' || 'backend-staging' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ inputs.sha }}
        run: |
          {
            echo "# Deploy results"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Environment | $TARGET_ENV |"
            echo "| Branch | ${GITHUB_REF_NAME} |"
            echo "| Commit | ${SHA::7} |"
            echo "| Services | $([ "$AI" = true ] && echo -n 'ai ')$([ "$CORE" = true ] && echo -n core) |"
            echo "| Result | $DEPLOY_OUTCOME |"
            echo "| Triggered by | ${GITHUB_ACTOR} |"
            echo "| Run | $RUN_URL |"
          } > deploy-summary.md
          cat deploy-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        # The summary is already in the job summary; a full artifact quota must not fail CI or skip deploys.
        continue-on-error: true
        if: always()
        with:
          name: deploy-summary-${{ github.ref_name }}
          path: deploy-summary.md
          if-no-files-found: error
          retention-days: 14
