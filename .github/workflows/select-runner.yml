name: Select runner

# Called first by ci.yml, cd.yml, mobile-release.yml, eval-regression.yml and the two honeyhive-* workflows; every later job runs on `runs_on`, so one setting moves a whole run
# between GitHub-hosted runners and the self-hosted machines, e.g. while GitHub-hosted runners are unavailable.
# This job itself runs on a self-hosted machine when self-hosted is chosen, so that choice needs no GitHub-hosted
# minute at all; `auto` runs it on GitHub-hosted, so set self-hosted while GitHub-hosted runners cannot start.
# See docs/development/ci-cd.md#ci-runners.

on:
  workflow_call:
    inputs:
      choice:
        description: auto, github-hosted or self-hosted
        type: string
        required: true
      label:
        description: Label a self-hosted machine must carry; `self-hosted` accepts any machine
        type: string
        default: self-hosted
      allow-self-hosted:
        description: false keeps the run on GitHub-hosted whatever the choice, e.g. for a pull request from a fork
        type: boolean
        default: true
    secrets:
      RUNNERS_READ_TOKEN:
        required: false
    outputs:
      runs_on:
        description: JSON for `runs-on`, read with fromJSON
        value: ${{ jobs.pick.outputs.runs_on }}
      reason:
        description: Why this runner was picked, for summaries
        value: ${{ jobs.pick.outputs.reason }}

permissions: {}

jobs:
  pick:
    runs-on: ${{ (inputs.choice == 'self-hosted' && inputs.allow-self-hosted) && fromJSON('["self-hosted"]') || 'ubuntu-24.04' }}
    outputs:
      runs_on: ${{ steps.pick.outputs.runs_on }}
      reason: ${{ steps.pick.outputs.reason }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci
          persist-credentials: false
      # Listing runners needs a token with Administration: read; the default GITHUB_TOKEN cannot do it, so without
      # RUNNERS_READ_TOKEN `auto` always resolves to GitHub-hosted.
      - name: Pick the runner
        id: pick
        env:
          SMARTLEDGER_RUNNER_CHOICE: ${{ inputs.choice }}
          SMARTLEDGER_RUNNER_LABEL: ${{ inputs.label }}
          SMARTLEDGER_ALLOW_SELF_HOSTED: ${{ inputs.allow-self-hosted }}
          RUNNERS_READ_TOKEN: ${{ secrets.RUNNERS_READ_TOKEN }}
        run: scripts/ci/pick-runner.sh
