name: Sync HoneyHive charts and alerts

# Applies .honeyhive/charts and .honeyhive/alerts to every project in
# .honeyhive/projects.yaml on every merge into main.
# Follows https://docs.honeyhive.ai/v2/cli-reference/config-as-code-charts-alerts
# and .honeyhive/README.md.

on:
  push:
    branches: [main]
    paths: [".honeyhive/charts/**", ".honeyhive/alerts/**", ".honeyhive/projects.yaml", "sync-dashboards.sh"]

permissions:
  contents: read

jobs:
  # The same runner choice as ci.yml, so the sync runs while GitHub-hosted runners cannot start.
  select-runner:
    uses: ./.github/workflows/select-runner.yml
    with:
      choice: ${{ vars.CI_RUNNER || 'github-hosted' }}
    secrets:
      RUNNERS_READ_TOKEN: ${{ secrets.RUNNERS_READ_TOKEN }}

  sync:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs_on) }}
    # Holds the runner token of ai/production, which reads the HoneyHive keys from Dopbase.
    environment: backend-production
    concurrency:
      group: honeyhive-dashboards
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-dopbase
      - name: Load the HoneyHive keys from Dopbase
        env:
          DOPBASE_URL: ${{ vars.DOPBASE_URL }}
          DOPBASE_TOKEN: ${{ secrets.DOPBASE_TOKEN_AI }}
        run: scripts/ci/load-dopbase.sh ai/production '(HH_API_URL|HH_CONTROL_PLANE_URL|HH_DATA_PLANE_API_KEY|HH_CONTROL_PLANE_API_KEY)'
      # Pinned so runs are reproducible. HoneyHive's installer is Linux-only, so a macOS self-hosted machine uses
      # its Homebrew install and only warns when the version differs. yq v4 and jq come with the Linux image and
      # with Homebrew on the self-hosted machines.
      - name: Install HoneyHive CLI
        run: scripts/ci/install-honeyhive.sh
      - name: Apply charts and alerts
        # HH_API_URL is the AI service's data plane URL; the keys above are loaded from Dopbase ai/production.
        run: HH_DATA_PLANE_URL="$HH_API_URL" bash sync-dashboards.sh
