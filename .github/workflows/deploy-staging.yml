name: Deploy staging

on:
  push:
    branches: [staging]

env:
  IMAGE: ghcr.io/${{ github.repository }}-ai

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  validate-config:
    runs-on: ubuntu-24.04
    environment: staging
    permissions: {}
    steps:
      - name: Check required deployment secrets
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          missing=0
          for name in STAGING_HOST STAGING_USER STAGING_SSH_KEY STAGING_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is required in the staging environment"
              missing=1
            fi
          done
          exit "$missing"

  build:
    needs: [ci, validate-config]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ai image
        uses: docker/build-push-action@v7
        with:
          context: backend/ai
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:staging
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - name: Deploy to staging VM over SSH
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$STAGING_SSH_KEY" > ~/.ssh/staging_key
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/staging_key
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/staging_key -o StrictHostKeyChecking=yes "$STAGING_USER@$STAGING_HOST" '
            set -e
            cd ~/smart-ledger
            git fetch origin staging
            git reset --hard origin/staging
            docker compose pull ai
            docker compose up -d ai
            curl -fsS "http://$(docker compose port ai 8001)/health"
          '
