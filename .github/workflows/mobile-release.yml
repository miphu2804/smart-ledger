name: Mobile release

# Manual Android build. It stays out of ci.yml so the Android toolchain (JDK, SDK, NDK, Gradle) is only
# downloaded when someone starts a build, and so a change here cannot break the CI/CD gates of the backend and web.
# Run it from the Actions tab (Use workflow from = the branch to build) or with `gh workflow run`.
# See docs/development/ci-cd.md#android-build.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Must be android-production on main, android-staging on staging and android-dev on any other branch; it picks the Firebase config
        type: choice
        required: true
        default: android-dev
        options: [android-dev, android-staging, android-production]
      runner:
        description: auto uses a free self-hosted machine when one is online, otherwise a GitHub-hosted runner
        type: choice
        required: true
        default: auto
        options: [auto, github-hosted, self-hosted]
      publish:
        description: android-production only; build a release-signed APK and publish it to R2 as the landing page download
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ inputs.environment }}-${{ github.ref_name }}
  cancel-in-progress: false

# Single source of the toolchain: the hosted setup installs these versions and the self-hosted preflight checks them.
env:
  NODE_MAJOR: "22"
  JAVA_MAJOR: "17"
  ANDROID_PLATFORM: "36"
  ANDROID_BUILD_TOOLS: 36.0.0
  ANDROID_NDK: 27.1.12297006
  RELEASE_KEY_ALIAS: smart-ledger

jobs:
  ### Gate: branch policy and a green CI run, before any runner is used ###

  gate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check the branch matches the environment
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          PUBLISH: ${{ inputs.publish }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != branch ]; then
            echo "::error::Run this workflow from a branch, not a tag."; exit 1
          fi
          # The branch decides the environment, so main can never be built with staging or dev config.
          case "$REF_NAME" in
            main) want=android-production ;;
            staging) want=android-staging ;;
            *) want=android-dev ;;
          esac
          if [ "$ENVIRONMENT" != "$want" ]; then
            echo "::error::Branch $REF_NAME builds only with $want, got $ENVIRONMENT."; exit 1
          fi
          # The landing page links to one file, and it must be the build that talks to the production backend.
          if [ "$PUBLISH" = true ] && [ "$ENVIRONMENT" != android-production ]; then
            echo "::error::publish is only allowed with android-production, got $ENVIRONMENT."; exit 1
          fi
      # Any other branch of this repository builds as android-dev, so a pull request can be tested before it merges.
      - name: Require a green CI run for the commit
        if: inputs.environment != 'android-dev'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          passed=$(gh run list --repo "$REPO" --workflow ci.yml --commit "$SHA" --status success --json databaseId --jq length)
          if [ "$passed" -eq 0 ]; then
            echo "::error::No successful CI run for ${SHA::7}. Wait for CI to pass, or re-run it."; exit 1
          fi

  ### Pick the runner: a free self-hosted machine, else GitHub-hosted ###

  select-runner:
    runs-on: ubuntu-24.04
    outputs:
      runs_on: ${{ steps.pick.outputs.runs_on }}
      reason: ${{ steps.pick.outputs.reason }}
    steps:
      # Listing runners needs a token with Administration: read; the default GITHUB_TOKEN cannot do it, so without
      # RUNNERS_READ_TOKEN `auto` always resolves to GitHub-hosted.
      - name: Pick the runner
        id: pick
        env:
          CHOICE: ${{ inputs.runner }}
          REPO: ${{ github.repository }}
          RUNNERS_READ_TOKEN: ${{ secrets.RUNNERS_READ_TOKEN }}
        run: |
          hosted='["ubuntu-24.04"]'
          selfhosted='["self-hosted","android-build"]'
          pick() { echo "runs_on=$1" >> "$GITHUB_OUTPUT"; echo "reason=$2" >> "$GITHUB_OUTPUT"; echo "Runner: $2"; exit 0; }
          [ "$CHOICE" = github-hosted ] && pick "$hosted" "chosen: github-hosted"
          [ "$CHOICE" = self-hosted ] && pick "$selfhosted" "chosen: self-hosted"
          [ -n "$RUNNERS_READ_TOKEN" ] || pick "$hosted" "auto: RUNNERS_READ_TOKEN not set, fell back to github-hosted"
          if ! free=$(GH_TOKEN="$RUNNERS_READ_TOKEN" gh api "repos/$REPO/actions/runners" --paginate \
            --jq '.runners[] | select(.status=="online" and .busy==false and any(.labels[]; .name=="android-build")) | .name' 2>&1); then
            pick "$hosted" "auto: runner list failed, fell back to github-hosted"
          fi
          if [ -n "$free" ]; then
            pick "$selfhosted" "auto: self-hosted online ($(echo "$free" | head -1))"
          fi
          pick "$hosted" "auto: no free self-hosted runner, fell back to github-hosted"

  ### Build ###

  build:
    needs: [gate, select-runner]
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs_on) }}
    environment: ${{ inputs.environment }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      # Baked into the bundle at build time, so they are Variables of each environment, not Secrets.
      EXPO_PUBLIC_USE_MOCK: ${{ vars.EXPO_PUBLIC_USE_MOCK }}
      EXPO_PUBLIC_MOCK_CORE: ${{ vars.EXPO_PUBLIC_MOCK_CORE }}
      EXPO_PUBLIC_MOCK_SHOPS: ${{ vars.EXPO_PUBLIC_MOCK_SHOPS }}
      EXPO_PUBLIC_API_ENDPOINT: ${{ vars.EXPO_PUBLIC_API_ENDPOINT }}
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID }}
      # Gradle needs more than its 2 GB default: with it the daemon ran out of Metaspace and stalled.
      GRADLE_JVM_ARGS: -Xmx6g -XX:MaxMetaspaceSize=1g
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve build settings
        id: cfg
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          # Play needs an AAB with every ABI; staging ships a universal APK so it also runs on emulators and
          # old phones; dev stays arm64-only for a fast build on a real phone. A published production build is an
          # APK because people install it straight from the landing page.
          production_format=aab
          [ "$PUBLISH" = true ] && production_format=apk
          case "$ENVIRONMENT" in
            android-production) { echo "format=$production_format"; echo "abis=armeabi-v7a,arm64-v8a,x86,x86_64"; } >> "$GITHUB_OUTPUT" ;;
            android-staging) { echo "format=apk"; echo "abis=armeabi-v7a,arm64-v8a,x86,x86_64"; } >> "$GITHUB_OUTPUT" ;;
            *) { echo "format=apk"; echo "abis=arm64-v8a"; } >> "$GITHUB_OUTPUT" ;;
          esac
          echo "TIMINGS=$RUNNER_TEMP/timings.txt" >> "$GITHUB_ENV"
          echo "start=$(date +%s)" > "$RUNNER_TEMP/timings.txt"

      # Fails before the build, which takes minutes, instead of at the upload.
      - name: Check the publish prerequisites
        if: inputs.publish
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          missing=""
          for name in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Publishing needs these in environment ${{ inputs.environment }}:$missing"; exit 1
          fi
          command -v aws > /dev/null || { echo "::error::Publishing needs the aws CLI on this runner."; exit 1; }


      # GitHub-hosted runners are clean VMs, so the toolchain is installed (and cached) on every run.
      - uses: actions/setup-node@v7
        if: runner.environment == 'github-hosted'
        with:
          node-version: ${{ env.NODE_MAJOR }}
          cache: npm
          cache-dependency-path: frontend/mobile/package-lock.json
      - uses: actions/setup-java@v6
        if: runner.environment == 'github-hosted'
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_MAJOR }}
      - uses: android-actions/setup-android@v4
        if: runner.environment == 'github-hosted'
        with:
          packages: platform-tools platforms;android-${{ env.ANDROID_PLATFORM }} build-tools;${{ env.ANDROID_BUILD_TOOLS }} ndk;${{ env.ANDROID_NDK }}
      - uses: gradle/actions/setup-gradle@v6
        if: runner.environment == 'github-hosted'

      # A self-hosted machine keeps its toolchain and Gradle/npm caches on disk. Pulling GitHub's cache or the NDK over
      # a home connection is slower than the build itself, so it only verifies versions and never downloads.
      - name: Preflight the self-hosted toolchain
        if: runner.environment == 'self-hosted'
        env:
          EXPECT_NODE_MAJOR: ${{ env.NODE_MAJOR }}
          EXPECT_JAVA_MAJOR: ${{ env.JAVA_MAJOR }}
          EXPECT_PLATFORM: ${{ env.ANDROID_PLATFORM }}
          EXPECT_BUILD_TOOLS: ${{ env.ANDROID_BUILD_TOOLS }}
          EXPECT_NDK: ${{ env.ANDROID_NDK }}
        run: node .github/scripts/android-preflight.mjs
      - name: Mark setup done
        run: echo "setup=$(date +%s)" >> "$TIMINGS"

      # The model is not in git, so the APK downloads it from R2 on first use. A publish uploads the version named in
      # core.ts when R2 lacks it (only missing or wrong-size files, so a released version is never rewritten); other
      # builds have no R2 credentials and carry on with a warning, as voice input then cannot work.
      - name: Resolve the speech model URL
        env:
          STT_MODEL_BASE_URL: ${{ vars.STT_MODEL_BASE_URL }}
          PUBLISH: ${{ inputs.publish }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          if [ -z "$STT_MODEL_BASE_URL" ]; then
            [ "$PUBLISH" = true ] && { echo "::error::Publishing needs variable STT_MODEL_BASE_URL."; exit 1; }
            echo "::warning::STT_MODEL_BASE_URL is not set: voice input in this build cannot download its model."; exit 0
          fi
          if ! line=$(node .github/scripts/stt-model.mjs check); then
            if [ "$PUBLISH" != true ]; then
              echo "$line" | sed 's/::error::/::warning::/'
              echo "::warning::Voice input in this build cannot download its model; a publish uploads it."; exit 0
            fi
            echo "$line" | sed 's/::error::/::notice::/'
            dir="$RUNNER_TEMP/stt-model"
            version=$(node .github/scripts/stt-model.mjs fetch "$dir") || { echo "$version"; exit 1; }
            aws s3 sync "$dir" "s3://$BUCKET/stt-model/$version/" --size-only
            rm -rf "$dir"
            line=$(node .github/scripts/stt-model.mjs check) || { echo "$line"; exit 1; }
          fi
          echo "$line"
          echo "$line" >> "$GITHUB_ENV"

      - name: Install JavaScript dependencies
        working-directory: frontend/mobile
        run: npm ci
      - name: Mark install done
        run: echo "install=$(date +%s)" >> "$TIMINGS"

      # app.config.js reads the Firebase file from the path in GOOGLE_SERVICES_JSON. The file is gitignored (public
      # repo), so it is written from the environment secret to a temp path and never lands in the workspace.
      - name: Write google-services.json
        env:
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$ANDROID_GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Secret ANDROID_GOOGLE_SERVICES_JSON is empty in environment ${{ inputs.environment }}."; exit 1
          fi
          printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON" > "$RUNNER_TEMP/google-services.json"
          echo "GOOGLE_SERVICES_JSON=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"

      # Without the secret the build keeps the template's debug keystore, which is public: fine for a test build, never
      # for a published one. The keystore is PKCS12, so the key shares the store password.
      - name: Write the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || { echo "No release keystore in this environment: signing with the debug keystore."; exit 0; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      # --clean regenerates android/ so a leftover from a previous build on a self-hosted machine cannot leak in.
      - name: Generate the native project
        working-directory: frontend/mobile
        run: npx expo prebuild --platform android --no-install --clean
      - name: Mark prebuild done
        run: echo "prebuild=$(date +%s)" >> "$TIMINGS"

      - name: Build
        id: build
        working-directory: frontend/mobile/android
        env:
          FORMAT: ${{ steps.cfg.outputs.format }}
          ABIS: ${{ steps.cfg.outputs.abis }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          task=assembleRelease
          [ "$FORMAT" = aab ] && task=bundleRelease
          # `expo prebuild --clean` rewrites build.gradle on every run, so the keystore is passed through the Android
          # Gradle plugin's injected signing properties, which override the signing config of the built variant.
          signing=()
          if [ -n "$RELEASE_KEYSTORE" ]; then
            signing=(
              "-Pandroid.injected.signing.store.file=$RELEASE_KEYSTORE"
              "-Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD"
              "-Pandroid.injected.signing.key.alias=$RELEASE_KEY_ALIAS"
              "-Pandroid.injected.signing.key.password=$KEYSTORE_PASSWORD"
            )
          fi
          ./gradlew "$task" "-PreactNativeArchitectures=$ABIS" "-Dorg.gradle.jvmargs=$GRADLE_JVM_ARGS" "${signing[@]}"
      - name: Remove the release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
      - name: Mark build done
        run: echo "gradle=$(date +%s)" >> "$TIMINGS"

      - name: Collect the artifact
        id: package
        env:
          FORMAT: ${{ steps.cfg.outputs.format }}
          ENVIRONMENT: ${{ inputs.environment }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$FORMAT" = aab ]; then
            built=frontend/mobile/android/app/build/outputs/bundle/release/app-release.aab
          else
            built=frontend/mobile/android/app/build/outputs/apk/release/app-release.apk
          fi
          [ -f "$built" ] || { echo "::error::Gradle finished but $built does not exist."; exit 1; }
          branch=$(echo "$REF_NAME" | tr -c 'A-Za-z0-9\n' '-')
          name="smart-ledger-${ENVIRONMENT#android-}-${branch}-${SHA::7}.$FORMAT"
          mkdir -p "$RUNNER_TEMP/android-out"
          cp "$built" "$RUNNER_TEMP/android-out/$name"
          echo "path=$RUNNER_TEMP/android-out/$name" >> "$GITHUB_OUTPUT"
      - name: Mark packaged
        run: echo "package=$(date +%s)" >> "$TIMINGS"

      # Shows where the APK size goes (native libraries per ABI, dex, assets) on the run page, so a size change can be
      # traced to its cause without downloading the file. Sizes are as stored in the APK (stored = compressed size).
      - name: Report the APK contents
        if: steps.cfg.outputs.format == 'apk'
        env:
          APK: ${{ steps.package.outputs.path }}
        run: |
          {
            echo "### APK contents"
            echo
            wc -c < "$APK" | awk '{ printf "Total: %.1f MB\n", $1 / 1048576 }'
            echo
            echo '```'
            zipinfo -l "$APK" | awk 'NF >= 10 && $4 ~ /^[0-9]+$/ {
                n = $10; g = n
                if (n ~ /^lib\//) { split(n, p, "/"); g = "lib/" p[2] }
                else if (n ~ /\.dex$/) g = "dex"
                else if (n ~ /^assets\//) g = "assets"
                else if (n ~ /^res\// || n == "resources.arsc") g = "res"
                else g = "other"
                raw[g] += $4; stored[g] += $6
              }
              END { printf "%-22s %10s %10s\n", "group", "raw MB", "stored MB"
                    for (g in raw) printf "%-22s %10.1f %10.1f\n", g, raw[g] / 1048576, stored[g] / 1048576 }'
            echo
            echo "Largest entries (stored MB, raw MB, name):"
            zipinfo -l "$APK" | awk 'NF >= 10 && $4 ~ /^[0-9]+$/ { printf "%8.2f %8.2f  %s\n", $6 / 1048576, $4 / 1048576, $10 }' \
              | sort -rn | head -40
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # builds/ keeps every published APK for rollback; latest.apk is the fixed URL the landing page links to.
      - name: Publish the APK to R2
        id: publish
        if: inputs.publish
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ vars.R2_BUCKET }}
          APK: ${{ steps.package.outputs.path }}
        run: |
          # Anyone can sign an update with the debug key, so a debug-signed APK must never reach the download link.
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          certs=$("$sdk/build-tools/$ANDROID_BUILD_TOOLS/apksigner" verify --print-certs "$APK")
          echo "$certs"
          if echo "$certs" | grep -q "CN=Android Debug"; then
            echo "::error::The APK is signed with the debug keystore; not publishing."; exit 1
          fi
          prefix="s3://$BUCKET/android/production"
          type=application/vnd.android.package-archive
          aws s3 cp "$APK" "$prefix/builds/$(basename "$APK")" --content-type "$type"
          aws s3 cp "$APK" "$prefix/latest.apk" --content-type "$type" --cache-control no-cache \
            --content-disposition 'attachment; filename="so-nghe-loi.apk"'


      - name: Write the build summary
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          SUMMARY_DIR: ${{ runner.temp }}/android-summary
          ARTIFACT_PATH: ${{ steps.package.outputs.path }}
          ENVIRONMENT: ${{ inputs.environment }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUNNER_REASON: ${{ needs.select-runner.outputs.reason }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          FORMAT: ${{ steps.cfg.outputs.format }}
          ABIS: ${{ steps.cfg.outputs.abis }}
        run: node .github/scripts/android-summary.mjs

      - uses: actions/upload-artifact@v7
        if: steps.package.outcome == 'success'
        with:
          name: android-${{ inputs.environment }}-${{ github.run_number }}
          path: ${{ runner.temp }}/android-out/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-build-summary-${{ inputs.environment }}-${{ github.run_number }}
          path: ${{ runner.temp }}/android-summary/*
          if-no-files-found: error
          retention-days: 14
