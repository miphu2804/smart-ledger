name: Eval regression

# Runs the agent_chat eval (backend/ai/evaluation/agent_chat) by hand, when a change to the agent or its memory needs
# one; it does not run on every change, because each run asks the models about 69 chat turns plus their judges. It
# scores everything on the runner with metrics built on HoneyHive's evaluator templates, writes the report to the job
# summary and to the open pull request of `ref`, and fails when a metric in its thresholds.toml misses its minimum.
# Nothing is sent to HoneyHive unless `sync` is on. Dispatch it from `staging`: the ai/staging settings come through
# the backend-staging environment, which only `staging` may use; `ref` picks the code that is evaluated.
# See docs/development/ci-cd.md#eval-regression.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to evaluate
        type: string
        required: true
      sync:
        description: Also sync the scores to HoneyHive as an experiment run (about 69 sessions of the monthly quota)
        type: boolean
        default: false
      runner:
        description: github-hosted, self-hosted or auto, as in ci.yml
        type: choice
        required: true
        default: self-hosted
        options: [github-hosted, self-hosted, auto]

permissions:
  contents: read
  pull-requests: write

jobs:
  select-runner:
    uses: ./.github/workflows/select-runner.yml
    with:
      choice: ${{ inputs.runner }}
    secrets:
      RUNNERS_READ_TOKEN: ${{ secrets.RUNNERS_READ_TOKEN }}

  eval:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs_on) }}
    environment: backend-staging
    timeout-minutes: 60
    env:
      DB_CONTAINER: eval-db-${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        working-directory: backend/ai
    steps:
      # The checked-out code runs with the job's settings; keeping the token out of .git/config keeps it from that
      # code. The report step passes its own token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
      # scripts/local-db.sh pushes the AI migrations with the Supabase CLI through npx.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: ./.github/actions/setup-dopbase
      # A throwaway database on a free port, so a run never touches a developer's smartledger-local-db on the same
      # machine; the eval refuses any database that is not on localhost.
      - name: Start and seed the database
        working-directory: .
        run: scripts/ci/start-eval-database.sh
      # The model gateway, embeddings and model aliases of ai/staging, pointed at the throwaway database. The HoneyHive
      # key stays only when the run syncs.
      - name: Write the AI settings
        working-directory: .
        env:
          DOPBASE_URL: ${{ vars.DOPBASE_URL }}
          DOPBASE_TOKEN: ${{ secrets.DOPBASE_AI_TOKEN }}
          SYNC: ${{ inputs.sync }}
        run: scripts/ci/write-eval-settings.sh
      - name: Run the eval
        env:
          SYNC: ${{ inputs.sync }}
        run: ../../scripts/ci/run-eval.sh
      - name: Publish the report
        if: always()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          SMARTLEDGER_REF: ${{ inputs.ref }}
        run: scripts/ci/publish-eval-report.sh
      - name: Remove the database and settings
        if: always()
        working-directory: .
        run: scripts/ci/remove-eval-database.sh
