services:
  postgres:
    profiles: ["infra"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-smartledger}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-smartledger} -d ${POSTGRES_DB:-smartledger}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    profiles: ["infra"]
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data

  ai:
    image: ghcr.io/miphu2804/smart-ledger-ai:${AI_IMAGE_TAG:-staging}
    build:
      context: ./backend/ai
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AI_PORT:-8001}:8001"
    environment:
      POSTGRES_URL: ${POSTGRES_URL:-postgresql://${POSTGRES_USER:-smartledger}:${POSTGRES_PASSWORD:-local-only}@postgres:5432/${POSTGRES_DB:-smartledger}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false

  core:
    profiles: ["backend"]
    image: ghcr.io/miphu2804/smart-ledger-core:${CORE_IMAGE_TAG:-staging}
    build:
      context: .
      dockerfile: docker/core.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CORE_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/${POSTGRES_DB:-smartledger}}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-${POSTGRES_USER:-smartledger}}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-${POSTGRES_PASSWORD:-local-only}}
      FLYWAY_ENABLED: "false"
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
    volumes:
      - ./.secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  migrate-core:
    profiles: ["migrations"]
    image: flyway/flyway:13.7.0
    command: migrate
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    volumes:
      - ./backend/core/src/main/resources/db/migration:/flyway/sql:ro
    environment:
      FLYWAY_URL: ${FLYWAY_URL:-}
      FLYWAY_USER: ${FLYWAY_USER:-}
      FLYWAY_PASSWORD: ${FLYWAY_PASSWORD:-}

  migrate-ai:
    profiles: ["migrations"]
    image: postgres:16-alpine
    entrypoint: ["sh", "-ec"]
    command:
      - 'exec psql "$$POSTGRES_URL" -v ON_ERROR_STOP=1 -f /migrations/001_create_chat_history.sql'
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    volumes:
      - ./backend/ai/migrations:/migrations:ro
    environment:
      POSTGRES_URL: ${POSTGRES_URL:-}

volumes:
  postgres-data:
  redis-data:
