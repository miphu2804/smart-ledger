services:
  postgres:
    profiles: ["infra"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-smartledger}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-smartledger} -d ${POSTGRES_DB:-smartledger}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    profiles: ["infra"]
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data

  ai:
    image: ghcr.io/miphu2804/smart-ledger-ai:${AI_IMAGE_TAG:-staging}
    build:
      context: ./backend/ai
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AI_PORT:-8001}:8001"
    environment:
      POSTGRES__URL: ${POSTGRES__URL:-postgresql://${POSTGRES_USER:-smartledger}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-smartledger}}
      REDIS__URL: ${REDIS__URL:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false

volumes:
  postgres-data:
  redis-data:
