# Dev and staging share the staging Supabase database and Redis Cloud database;
# there are no local PostgreSQL or Redis containers. Run with
#   docker compose --env-file .env.staging --env-file backend/core/.env up --build
# `.env.staging` supplies database credentials; `backend/core/.env` supplies
# FIREBASE_PROJECT_ID and the host path of the service-account key to mount.
# AI reads its own settings (model, API keys) from `backend/ai/.env`.
# Flyway is off by default because the database is shared; only the migration
# owner runs `FLYWAY_ENABLED=true docker compose ...` from merged `staging` code.
# See README "Database migrations".
services:
  core:
    build:
      context: ./backend/core
      dockerfile: Dockerfile
    ports:
      - "${CORE_PORT:-8000}:8080"
    environment:
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      OPENAPI_ENABLED: ${OPENAPI_ENABLED:-true}
      SWAGGER_UI_ENABLED: ${SWAGGER_UI_ENABLED:-true}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_USERNAME: ${DATABASE_USERNAME:?DATABASE_USERNAME is required}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-false}
      AI_BASE_URL: http://ai:8001
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?FIREBASE_PROJECT_ID is required}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
      FIREBASE_AUTH_EMULATOR_HOST: ${FIREBASE_AUTH_EMULATOR_HOST:-}
      CLOUDINARY_ENABLED: ${CLOUDINARY_ENABLED:-false}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_PUBLIC_ID_PREFIX: ${CLOUDINARY_PUBLIC_ID_PREFIX:-}
      MEDIA_UPLOAD_LEASE_SECONDS: ${MEDIA_UPLOAD_LEASE_SECONDS:-300}
      CLOUDINARY_CLEANUP_FIXED_DELAY_MS: ${CLOUDINARY_CLEANUP_FIXED_DELAY_MS:-60000}
    volumes:
      - type: bind
        source: ${GOOGLE_APPLICATION_CREDENTIALS:?GOOGLE_APPLICATION_CREDENTIALS is required}
        target: /run/secrets/firebase-service-account.json
        read_only: true

  ai:
    build:
      context: ./backend/ai
    ports:
      - "${AI_PORT:-8001}:8001"
    env_file:
      - path: backend/ai/.env
        required: false
    environment:
      POSTGRES_URL: ${POSTGRES_URL:?POSTGRES_URL is required}
      REDIS_URL: ${REDIS_URL:-}
