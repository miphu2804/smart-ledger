info:
  name: Mark many read
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/me/notifications/read"
  body:
    type: json
    data: |-
      {
        "ids": [
          {{notificationId}}
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
