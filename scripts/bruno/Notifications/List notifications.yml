info:
  name: List notifications
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/me/notifications"
  params:
    - name: shopId
      value: ""
      type: query
      disabled: true
    - name: type
      value: ""
      type: query
      disabled: true
    - name: unreadOnly
      value: ""
      type: query
      disabled: true
    - name: page
      value: ""
      type: query
      disabled: true
    - name: size
      value: ""
      type: query
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: if (res.body.items?.length) bru.setVar("notificationId", res.body.items[0].id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
