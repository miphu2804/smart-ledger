info:
  name: Create expense
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/expenses"
  headers:
    - name: Idempotency-Key
      value: "{{$randomUUID}}"
  body:
    type: json
    data: |-
      {
        "category": "Bruno",
        "description": "Bruno expense",
        "amountVnd": 50000,
        "paymentMethod": "CASH"
      }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.id
        method: jsonq
      variable:
        name: expenseId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
