info:
  name: Me without token
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/me"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
    - expression: res.body.code
      operator: eq
      value: unauthorized

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
