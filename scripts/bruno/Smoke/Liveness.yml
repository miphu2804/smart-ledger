info:
  name: Liveness
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/actuator/health/liveness"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.status
      operator: eq
      value: UP

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
