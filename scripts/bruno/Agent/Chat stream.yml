info:
  name: Chat stream
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/agent/chat/stream"
  headers:
    - name: Accept
      value: text/event-stream, application/json
  body:
    type: json
    data: |-
      {
        "message": "Hôm nay bán được bao nhiêu?"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
