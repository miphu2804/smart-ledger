info:
  name: Chat
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/agent/chat"
  body:
    type: json
    data: |-
      {
        "message": "Hôm nay bán được bao nhiêu?"
      }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.conversation_id
        method: jsonq
      variable:
        name: conversationId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
