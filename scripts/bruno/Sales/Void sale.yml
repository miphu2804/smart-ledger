info:
  name: Void sale
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/v1/sales/{{saleId}}/void"
  headers:
    - name: Idempotency-Key
      value: "{{$randomUUID}}"
  body:
    type: json
    data: |-
      {
        "reason": "Bruno test",
        "restockItems": true,
        "refundMethod": "CASH"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
