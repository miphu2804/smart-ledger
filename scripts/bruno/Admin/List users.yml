info:
  name: List users
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/admin/users"
  params:
    - name: query
      value: ""
      type: query
      disabled: true
    - name: status
      value: ""
      type: query
      disabled: true
    - name: page
      value: ""
      type: query
      disabled: true
    - name: size
      value: ""
      type: query
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: if (res.body.items?.length) bru.setVar("userId", res.body.items[0].id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
