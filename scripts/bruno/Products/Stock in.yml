info:
  name: Stock in
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/api/v1/products/{{productId}}/stock-in"
  headers:
    - name: Idempotency-Key
      value: "{{$randomUUID}}"
  body:
    type: json
    data: |-
      {
        "quantity": 5,
        "reason": "Bruno test"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
