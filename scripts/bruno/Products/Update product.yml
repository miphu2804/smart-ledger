info:
  name: Update product
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/products/{{productId}}"
  body:
    type: json
    data: |-
      {
        "sellingPriceVnd": 25000
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
