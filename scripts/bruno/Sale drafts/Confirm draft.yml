info:
  name: Confirm draft
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/v1/sale-drafts/{{draftId}}/confirm"
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.id
        method: jsonq
      variable:
        name: saleId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
