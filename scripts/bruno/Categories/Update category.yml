info:
  name: Update category
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/categories/{{categoryId}}"
  body:
    type: json
    data: |-
      {
        "name": "Bruno category 2"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
