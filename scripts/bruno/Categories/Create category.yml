info:
  name: Create category
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/categories"
  body:
    type: json
    data: |-
      {
        "name": "Bruno category"
      }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.id
        method: jsonq
      variable:
        name: categoryId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
