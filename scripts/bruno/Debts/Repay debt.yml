info:
  name: Repay debt
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/v1/debts/{{debtId}}/payments"
  headers:
    - name: Idempotency-Key
      value: "{{$randomUUID}}"
  body:
    type: json
    data: |-
      {
        "amountVnd": 10000,
        "paymentMethod": "CASH"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
