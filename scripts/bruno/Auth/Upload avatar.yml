info:
  name: Upload avatar
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/v1/me/avatar"
  headers:
    - name: Idempotency-Key
      value: "{{$randomUUID}}"
  body:
    type: multipart-form
    data:
      - name: image
        type: file
        value:
          - fixtures/pixel.png
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
