info:
  name: Link
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/zalo/link"
  body:
    type: json
    data: |-
      {
        "proof": "{{zaloProof}}",
        "clientVerifier": "{{zaloClientVerifier}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
