info:
  name: Exchange
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/zalo/exchange"
  body:
    type: json
    data: |-
      {
        "proof": "{{zaloProof}}",
        "clientVerifier": "{{zaloClientVerifier}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
