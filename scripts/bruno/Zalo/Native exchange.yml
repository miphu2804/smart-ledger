info:
  name: Native exchange
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/zalo/native/exchange"
  body:
    type: json
    data: |-
      {
        "nativeClientId": "{{zaloNativeClientId}}",
        "requestId": "{{zaloRequestId}}",
        "handoffReference": "{{zaloHandoffReference}}",
        "clientVerifier": "{{zaloClientVerifier}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
