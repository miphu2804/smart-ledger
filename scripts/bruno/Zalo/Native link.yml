info:
  name: Native link
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/zalo/native/link"
  body:
    type: json
    data: |-
      {
        "nativeClientId": "{{zaloNativeClientId}}",
        "requestId": "{{zaloRequestId}}",
        "handoffReference": "{{zaloHandoffReference}}",
        "clientVerifier": "{{zaloClientVerifier}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
