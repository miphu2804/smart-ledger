spring:
  application:
    name: smart-ledger-core
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/smartledger}
    username: ${DATABASE_USERNAME:smartledger}
    password: ${DATABASE_PASSWORD:smartledger}
    hikari:
      # Hikari's default (1 ms) fails startup on the first refused connection; the first connection after a container
      # recreate on the VPS sometimes ends with "SSL peer shut down incorrectly". Retrying for 30 s keeps that from
      # crashing the container while a database that stays down still fails startup.
      initialization-fail-timeout: 30000 # milliseconds; Hikari binds a plain long
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
  jpa:
    hibernate:
      ddl-auto: validate
  mvc:
    async:
      # The agent answer stream lasts up to the AI turn timeout (35 s by default), past Tomcat's 30 s default.
      request-timeout: 60s
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:${PORT:8080}}
  # Tomcat validates the proxy peer before using forwarded headers. See Core README for trust boundaries.
  forward-headers-strategy: native

firebase:
  project-id: ${FIREBASE_PROJECT_ID:}
  service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}

# Remain off until merged V17 is installed and runtime/consumer rollout is approved.
zalo:
  enabled: ${ZALO_ENABLED:false}
  app-id: ${ZALO_APP_ID:}
  app-secret: ${ZALO_APP_SECRET:}
  callback-url: ${ZALO_CALLBACK_URL:}
  client-origins: ${ZALO_CLIENT_ORIGINS:}
  session-encryption-key: ${ZALO_SESSION_ENCRYPTION_KEY:}
  session-ttl-seconds: ${ZALO_SESSION_TTL_SECONDS:300}
  proof-ttl-seconds: ${ZALO_PROOF_TTL_SECONDS:90}
  http-timeout-seconds: ${ZALO_HTTP_TIMEOUT_SECONDS:10}
  # Runtime default stays off. Apply merged V18 before enabling with the reviewed staging configuration.
  native:
    enabled: ${ZALO_NATIVE_ENABLED:false}
    client-id: ${ZALO_NATIVE_CLIENT_ID:}
    return-target-id: ${ZALO_NATIVE_RETURN_TARGET_ID:}
    return-url: ${ZALO_NATIVE_RETURN_URL:}
    package-name: ${ZALO_NATIVE_PACKAGE_NAME:vn.teamhexa.songheloi}
    certificate-sha256: ${ZALO_NATIVE_CERTIFICATE_SHA256:}
    handoff-ttl-seconds: ${ZALO_NATIVE_HANDOFF_TTL_SECONDS:90}

cloudinary:
  enabled: ${CLOUDINARY_ENABLED:false}
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  public-id-prefix: ${CLOUDINARY_PUBLIC_ID_PREFIX:}
  cleanup:
    fixed-delay-ms: ${CLOUDINARY_CLEANUP_FIXED_DELAY_MS:60000}

ai:
  base-url: ${AI_BASE_URL:http://localhost:8001}
  internal-token: ${INTERNAL_API_TOKEN:}

smartledger:
  ai-quota:
    enabled: ${AI_QUOTA_ENABLED:false}
    recovery-enabled: ${AI_QUOTA_RECOVERY_ENABLED:false}
  rate-limit:
    # Apply merged V20 and upgrade all writers before enabling on shared environments.
    enabled: ${USER_RATE_LIMIT_ENABLED:false}
  user-activity:
    enabled: ${USER_ACTIVITY_ENABLED:false}
    cache-maximum-size: ${USER_ACTIVITY_CACHE_MAXIMUM_SIZE:10000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  idempotency:
    ttl-days: ${IDEMPOTENCY_TTL_DAYS:30}
  media:
    upload-lease-seconds: ${MEDIA_UPLOAD_LEASE_SECONDS:300}

billing:
  subscription:
    fulfillment-enabled: ${BILLING_FULFILLMENT_ENABLED:false}
  enabled: ${BILLING_ENABLED:false}
  webhook-enabled: ${SEPAY_WEBHOOK_ENABLED:false}
  integration-key: ${SEPAY_INTEGRATION_KEY:}
  webhook-secret: ${SEPAY_WEBHOOK_SECRET:}
  recipient-bank-code: ${BILLING_RECIPIENT_BANK_CODE:}
  recipient-account-number: ${BILLING_RECIPIENT_ACCOUNT_NUMBER:}
  recipient-account-name: ${BILLING_RECIPIENT_ACCOUNT_NAME:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html
