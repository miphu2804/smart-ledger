spring:
  application:
    name: smart-ledger-core
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/smartledger}
    username: ${DATABASE_USERNAME:smartledger}
    password: ${DATABASE_PASSWORD:smartledger}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
  jpa:
    hibernate:
      ddl-auto: validate

server:
  port: ${SERVER_PORT:${PORT:8080}}

firebase:
  project-id: ${FIREBASE_PROJECT_ID:}

ai:
  base-url: ${AI_BASE_URL:http://localhost:8001}
  internal-token: ${INTERNAL_API_TOKEN:}

smartledger:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  idempotency:
    ttl-days: ${IDEMPOTENCY_TTL_DAYS:30}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html
