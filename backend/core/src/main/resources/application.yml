spring:
  application:
    name: smart-ledger-core
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/smartledger}
    username: ${DATABASE_USERNAME:smartledger}
    password: ${DATABASE_PASSWORD:smartledger}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
  jpa:
    hibernate:
      ddl-auto: validate
  mvc:
    async:
      # The agent answer stream lasts up to the AI turn timeout (35 s by default), past Tomcat's 30 s default.
      request-timeout: 60s
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:${PORT:8080}}

firebase:
  project-id: ${FIREBASE_PROJECT_ID:}
  service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}

# Remain off until merged V17 is installed and runtime/consumer rollout is approved.
zalo:
  enabled: ${ZALO_ENABLED:false}
  app-id: ${ZALO_APP_ID:}
  app-secret: ${ZALO_APP_SECRET:}
  callback-url: ${ZALO_CALLBACK_URL:}
  client-origins: ${ZALO_CLIENT_ORIGINS:}
  session-encryption-key: ${ZALO_SESSION_ENCRYPTION_KEY:}
  session-ttl-seconds: ${ZALO_SESSION_TTL_SECONDS:300}
  proof-ttl-seconds: ${ZALO_PROOF_TTL_SECONDS:90}
  http-timeout-seconds: ${ZALO_HTTP_TIMEOUT_SECONDS:10}
  # Runtime default stays off. Apply merged V18 before enabling with the reviewed staging configuration.
  native:
    enabled: ${ZALO_NATIVE_ENABLED:false}
    client-id: ${ZALO_NATIVE_CLIENT_ID:}
    return-target-id: ${ZALO_NATIVE_RETURN_TARGET_ID:}
    return-url: ${ZALO_NATIVE_RETURN_URL:}
    package-name: ${ZALO_NATIVE_PACKAGE_NAME:vn.teamhexa.songheloi}
    certificate-sha256: ${ZALO_NATIVE_CERTIFICATE_SHA256:}
    handoff-ttl-seconds: ${ZALO_NATIVE_HANDOFF_TTL_SECONDS:90}

cloudinary:
  enabled: ${CLOUDINARY_ENABLED:false}
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  public-id-prefix: ${CLOUDINARY_PUBLIC_ID_PREFIX:}
  cleanup:
    fixed-delay-ms: ${CLOUDINARY_CLEANUP_FIXED_DELAY_MS:60000}

ai:
  base-url: ${AI_BASE_URL:http://localhost:8001}
  internal-token: ${INTERNAL_API_TOKEN:}

smartledger:
  user-activity:
    enabled: ${USER_ACTIVITY_ENABLED:false}
    cache-maximum-size: ${USER_ACTIVITY_CACHE_MAXIMUM_SIZE:10000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  idempotency:
    ttl-days: ${IDEMPOTENCY_TTL_DAYS:30}
  media:
    upload-lease-seconds: ${MEDIA_UPLOAD_LEASE_SECONDS:300}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html
