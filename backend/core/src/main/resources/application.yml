spring:
  application:
    name: smart-ledger-core
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/smartledger}
    username: ${DATABASE_USERNAME:smartledger}
    password: ${DATABASE_PASSWORD:smartledger}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
  jpa:
    hibernate:
      ddl-auto: validate

server:
  port: ${SERVER_PORT:8080}

firebase:
  project-id: ${FIREBASE_PROJECT_ID:}
  service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}

ai:
  base-url: ${AI_BASE_URL:http://localhost:8001}
  internal-token: ${INTERNAL_API_TOKEN:}

smartledger:
  cors:
    # Default covers the Vercel web build (per-deployment preview URLs and the staging alias);
    # set CORS_ALLOWED_ORIGINS to override, e.g. for a production domain.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://smart-ledger-*-miphu2804s-projects.vercel.app,https://smart-ledger-staging.vercel.app}
  idempotency:
    ttl-days: ${IDEMPOTENCY_TTL_DAYS:30}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
