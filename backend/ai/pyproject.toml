[project]
name = "smart-ledger-ai"
version = "0.1.0"
description = "SmartLedger internal AI API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "langchain>=1.4.2",
    "langchain-openai>=1.6.2",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "redis>=5.0",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
