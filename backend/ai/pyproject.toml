[project]
name = "smart-ledger-ai"
version = "0.1.0"
description = "SmartLedger internal AI API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pgvector>=0.4",
    "psycopg[binary]>=3.2",
    "pydantic-ai-slim[openai]>=2.54.0",
    "pydantic-settings>=2.6",
    "redis>=5.0",
    "sqlalchemy>=2.1.4",
    "sqlglot>=30.21.0",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.8",
]
# Local embedding model for agent memory (AGENT_MEMORY_ENABLED). Pulls in torch, so
# the Docker image leaves it out until memory is turned on.
memory = [
    "sentence-transformers>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
