# Backend stack of one environment: Core joins the external `edge` network as core-<environment>, where the shared
# Caddy in deploy/edge/ reaches it; AI is reachable only from Core inside this project's own network. Staging and
# production run side by side on one VPS, each in its own app directory (/opt/smartledger, /opt/smartledger-production)
# next to these files, none of which are in Git:
#   .env               ENVIRONMENT, CORE_ALIAS, CORE_IMAGE, AI_IMAGE; the deploy rewrites the image lines
#   core.env, ai.env   service variables from Dopbase core/<env> and ai/<env>; every deploy rewrites them
#   bifrost.env        Dopbase bifrost/<env>, written by deploy/ansible/
# See docs/development/ci-cd.md#vps.

# The project name sets the container and volume prefix, and both app directories would otherwise name the
# project after themselves (smartledger, smartledger-production). ENVIRONMENT keeps it kebab-case like the
# repository and the GHCR images, without renaming the directories the deploy and the playbook write to.
name: smart-ledger-${ENVIRONMENT:?ENVIRONMENT is required, staging or production}

services:
  core:
    image: ${CORE_IMAGE:?CORE_IMAGE is required}
    env_file:
      - core.env
    environment:
      SERVER_PORT: 8080
      AI_BASE_URL: http://ai:8001
      # The database is shared with the migration owner's manual runs; see README "Database migrations".
      FLYWAY_ENABLED: "false"
    depends_on:
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      # The VPS disk is the bottleneck: during the production Infra apply on 2026-11-03, iowait stayed at 40-58 % while
      # Core, Bifrost and image pulls shared it, and Core took 151 s from its container start to the first database
      # connection (62 s in a normal deploy). Failed checks inside this window do not count, and the first passing
      # check still marks Core healthy at once.
      start_period: 240s
      retries: 6
    networks:
      default:
      edge:
        aliases:
          - ${CORE_ALIAS:?CORE_ALIAS is required, core-staging or core-production}
    # The VPS resolver appends a search domain with wildcard DNS (bkcloud.vn): while AI is down, `ai` would
    # resolve to an outside host and Core would send it the internal token and shop data.
    dns_search: .
    restart: unless-stopped
    logging: &logging
      options:
        max-size: "10m"
        max-file: "3"

  ai:
    image: ${AI_IMAGE:?AI_IMAGE is required}
    env_file:
      - ai.env
    environment:
      SERVER_PORT: 8001
    healthcheck:
      # The slim image has no curl.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    # Docker's 10 s default kills AI mid-shutdown: an open chat stream may run to the 35 s turn limit, then
    # memory writes wait up to 10 s, HoneyHive session updates 10 s and the span flush 5 s.
    stop_grace_period: 60s
    restart: unless-stopped
    logging: *logging

  # Model gateway (Bifrost) for AI at http://bifrost:8080. It also joins `edge` as gateway-<environment>, where Caddy
  # serves its admin UI behind the admin login and refuses its inference routes. Pinned by digest (v2.3.2) and not
  # rolled by deploy.sh: the playbook starts it, and a new version is a change to this file. bifrost.json is
  # authoritative over the config store in the volume; bifrost.env holds the provider key, the virtual key and the
  # admin login it references, a resolved copy of secrets/<env>/env/.env.bifrost.
  bifrost:
    image: maximhq/bifrost:v2.4.0@sha256:a1c90607dcfd13c1fb2f9476ceb3bb24407a50ade7fdf3e61a59fb42b09e5c57
    env_file:
      - bifrost.env
    environment:
      # About 90% of mem_limit, per the Bifrost Docker tuning guide; chat traffic is a few requests per second.
      GOMEMLIMIT: 460MiB
    mem_limit: 512m
    cpus: 1
    volumes:
      - bifrost-data:/app/data
      - ./bifrost.json:/app/data/config.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      # Bootstrap syncs the MCP library and the model catalog first; it took 43 s on production.
      start_period: 90s
      retries: 3
    networks:
      default:
      edge:
        aliases:
          - gateway-${ENVIRONMENT}
    # Same wildcard-DNS guard as Core: provider hostnames must not resolve through the VPS search domain.
    dns_search: .
    restart: unless-stopped
    logging: *logging

volumes:
  bifrost-data:

networks:
  edge:
    external: true
