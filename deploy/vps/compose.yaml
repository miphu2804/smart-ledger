# Backend stack of one environment: Core joins the external `edge` network as core-<environment>, where the shared
# Caddy in deploy/edge/ reaches it; AI is reachable only from Core inside this project's own network. Staging and
# production run side by side on one VPS, each in its own app directory (/opt/smartledger, /opt/smartledger-production)
# next to these files, none of which are in Git:
#   .env               ENVIRONMENT, CORE_ALIAS, CORE_IMAGE, AI_IMAGE; the deploy rewrites the image lines
#   core.env, ai.env, bifrost.env
#                      service variables, resolved copies of secrets/<env>/env/.env.core, .env.ai and .env.bifrost
#   github.core.env, github.ai.env
#                      settings GitHub owns (CORS, model, tracing); the deploy rewrites them and
#                      they override the files above
# See docs/development/ci-cd.md#vps.

# The project name sets the container and volume prefix, and both app directories would otherwise name the
# project after themselves (smartledger, smartledger-production). ENVIRONMENT keeps it kebab-case like the
# repository and the GHCR images, without renaming the directories the deploy and the playbook write to.
name: smart-ledger-${ENVIRONMENT:?ENVIRONMENT is required, staging or production}

services:
  core:
    image: ${CORE_IMAGE:?CORE_IMAGE is required}
    env_file:
      - core.env
      - path: github.core.env
        required: false
    environment:
      SERVER_PORT: 8080
      AI_BASE_URL: http://ai:8001
      # The database is shared with the migration owner's manual runs; see README "Database migrations".
      FLYWAY_ENABLED: "false"
    depends_on:
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 6
    networks:
      default:
      edge:
        aliases:
          - ${CORE_ALIAS:?CORE_ALIAS is required, core-staging or core-production}
    # The VPS resolver appends a search domain with wildcard DNS (bkcloud.vn): while AI is down, `ai` would
    # resolve to an outside host and Core would send it the internal token and shop data.
    dns_search: .
    restart: unless-stopped
    logging: &logging
      options:
        max-size: "10m"
        max-file: "3"

  ai:
    image: ${AI_IMAGE:?AI_IMAGE is required}
    env_file:
      - ai.env
      - path: github.ai.env
        required: false
    environment:
      SERVER_PORT: 8001
    healthcheck:
      # The slim image has no curl.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    restart: unless-stopped
    logging: *logging

  # Model gateway (Bifrost) for AI, reachable only inside this project's network at http://bifrost:8080. Pinned by
  # digest (v2.3.2) and not rolled by deploy.sh: the playbook starts it, and a new version is a change to this file.
  # bifrost.json is authoritative over the config store in the volume; bifrost.env holds the provider key and the
  # virtual key it references, a resolved copy of secrets/<env>/env/.env.bifrost.
  bifrost:
    image: maximhq/bifrost:v2.3.2@sha256:f5b18826349fe9e1c402c10d19f1cbb5567a3c800ad928580d07f72e69106ec7
    env_file:
      - bifrost.env
    environment:
      # About 90% of mem_limit, per the Bifrost Docker tuning guide; chat traffic is a few requests per second.
      GOMEMLIMIT: 460MiB
    mem_limit: 512m
    cpus: 1
    volumes:
      - bifrost-data:/app/data
      - ./bifrost.json:/app/data/config.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    # Same wildcard-DNS guard as Core: provider hostnames must not resolve through the VPS search domain.
    dns_search: .
    restart: unless-stopped
    logging: *logging

volumes:
  bifrost-data:

networks:
  edge:
    external: true
