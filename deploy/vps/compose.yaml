# Backend stack on one VPS: a Cloudflare Tunnel carries HTTPS traffic to Core, so the VPS publishes
# no port; AI is reachable only from Core inside the Compose network. Lives in the app directory on the VPS (default /opt/smartledger)
# next to these files, none of which are in Git:
#   .env               TUNNEL_TOKEN, CORE_IMAGE, AI_IMAGE; the deploy rewrites the image lines
#   core.env, ai.env   service variables, resolved copies of secrets/<env>/env/.env.core and .env.ai
#   github.core.env, github.ai.env
#                      settings GitHub owns (CORS, model, tracing); the deploy rewrites them and
#                      they override the files above
# See docs/development/ci-cd.md#vps.
services:
  core:
    image: ${CORE_IMAGE:?CORE_IMAGE is required}
    env_file:
      - core.env
      - path: github.core.env
        required: false
    environment:
      SERVER_PORT: 8080
      AI_BASE_URL: http://ai:8001
      # The database is shared with the migration owner's manual runs; see README "Database migrations".
      FLYWAY_ENABLED: "false"
    depends_on:
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 6
    restart: unless-stopped
    logging: &logging
      options:
        max-size: "10m"
        max-file: "3"

  ai:
    image: ${AI_IMAGE:?AI_IMAGE is required}
    env_file:
      - ai.env
      - path: github.ai.env
        required: false
    environment:
      SERVER_PORT: 8001
    healthcheck:
      # The slim image has no curl.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    restart: unless-stopped
    logging: *logging

  # Remotely managed tunnel: its public hostname and the origin http://core:8080 are set in the
  # Cloudflare dashboard, and the connector only dials out, so no inbound port is open.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN is required}
    depends_on:
      - core
    restart: unless-stopped
    logging: *logging
