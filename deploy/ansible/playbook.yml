# One-time setup of a backend VPS, safe to re-run: it brings the machine back to this state and
# uploads the env files again. It covers the VPS part of docs/development/ci-cd.md#vps; the GitHub
# secrets stay manual. Run it through the wrapper, which exports the environment's files from Dopbase into a
# temporary directory, loads .env.vps into the shell and passes the directory as env_dir:
#   scripts/secrets/vps-playbook.sh staging
# Staging and production share one VPS: run it once per environment. Both .env.vps files must hold the same
# VPS_SSH_PUBLIC_KEY, because the deploy user keeps only that one key.
# Needs the full `ansible` package (community.general and ansible.posix) and an admin login with
# sudo on the VPS; the playbook itself never uses the `deploy` user to log in.
- name: Prepare the SmartLedger backend VPS
  hosts: all
  become: true
  vars:
    # Staging keeps the directory it had before production joined the VPS.
    app_dir: "{{ '/opt/smartledger' if smartledger_env == 'staging' else '/opt/smartledger-' + smartledger_env }}"
    # The shared Caddy (deploy/edge/), which proxies each environment's domain to its Core.
    edge_dir: /opt/smartledger-edge
    # The team's secrets manager (deploy/dopbase/), shared by every environment.
    dopbase_dir: /opt/dopbase
    # Public name of Dopbase that resolves to the VPS, for example secrets.<domain>; empty skips Dopbase.
    dopbase_domain: "{{ lookup('env', 'DOPBASE_DOMAIN') }}"
    # Nightly off-site copy of the Dopbase volume (deploy/dopbase/backup.sh). An empty bucket skips the cron job,
    # so Dopbase can run before the bucket exists. The recipient is the age public key whose private half the
    # maintainer keeps off the VPS; the token needs object write on that bucket only.
    dopbase_backup_bucket: "{{ lookup('env', 'DOPBASE_BACKUP_BUCKET') }}"
    dopbase_backup_endpoint: "{{ lookup('env', 'DOPBASE_BACKUP_ENDPOINT') }}"
    dopbase_backup_recipient: "{{ lookup('env', 'DOPBASE_BACKUP_RECIPIENT') }}"
    dopbase_backup_key_id: "{{ lookup('env', 'DOPBASE_BACKUP_KEY_ID') }}"
    dopbase_backup_secret: "{{ lookup('env', 'DOPBASE_BACKUP_SECRET') }}"
    dopbase_backup_hour: 3
    # Monitoring shared by every environment (deploy/monitoring/). An empty domain skips it; the password applies
    # on Grafana's first start, and the Discord webhook and Telegram chat both receive every alert.
    monitoring_dir: /opt/smart-ledger-monitoring
    monitor_domain: "{{ lookup('env', 'MONITOR_DOMAIN') }}"
    grafana_admin_password: "{{ lookup('env', 'GRAFANA_ADMIN_PASSWORD') }}"
    monitor_discord_webhook_url: "{{ lookup('env', 'MONITOR_DISCORD_WEBHOOK_URL') }}"
    monitor_telegram_bot_token: "{{ lookup('env', 'MONITOR_TELEGRAM_BOT_TOKEN') }}"
    monitor_telegram_chat_id: "{{ lookup('env', 'MONITOR_TELEGRAM_CHAT_ID') }}"
    # This environment's read-only Supabase login for the product dashboards (ADR-0003), from its .env.monitor. An
    # empty host leaves that environment's datasource unconfigured.
    grafana_pg_host: "{{ lookup('env', 'GRAFANA_PG_HOST') }}"
    grafana_pg_port: "{{ lookup('env', 'GRAFANA_PG_PORT') | default('5432', true) }}"
    grafana_pg_database: "{{ lookup('env', 'GRAFANA_PG_DATABASE') | default('postgres', true) }}"
    grafana_pg_user: "{{ lookup('env', 'GRAFANA_PG_USER') }}"
    grafana_pg_password: "{{ lookup('env', 'GRAFANA_PG_PASSWORD') }}"
    deploy_user: deploy
    lazydocker_version: 0.25.2
    lazydocker_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'x86_64' }}"
    lazydocker_sha256:
      x86_64: 0d9dbfc26068b218e7ed84b104748cadc6e3cf733c0afd35465306fb39b9523c
      arm64: 005c38b685aaa557e7d646d83a3dadb5024340eeed8c6a2e1949eee6f530de23
    swap_size_mb: 2048
    # Resolved env files of this environment, pulled by scripts/secrets (docs/development/secrets-and-env.md).
    env_dir: "{{ playbook_dir }}/../../secrets/{{ smartledger_env }}/env"
    # Public name of this environment's Core that resolves to the VPS, for example 203-0-113-10.sslip.io,
    # prod.203-0-113-10.sslip.io or api.<domain>.
    caddy_domain: "{{ lookup('env', 'CADDY_DOMAIN') }}"
    # Public name of this environment's Bifrost admin UI, for example gateway-staging.<domain>; empty serves no UI.
    gateway_domain: "{{ lookup('env', 'GATEWAY_DOMAIN') }}"
    # Public half of the CI deploy key whose private half is secret VPS_SSH_KEY.
    deploy_public_key: "{{ lookup('env', 'VPS_SSH_PUBLIC_KEY') }}"
    # A classic token with only `read:packages`, for private GHCR packages; empty skips `docker login`.
    ghcr_username: "{{ lookup('env', 'GHCR_USERNAME') }}"
    ghcr_read_token: "{{ lookup('env', 'GHCR_READ_TOKEN') }}"

  tasks:
    - name: Install Docker, Compose and the firewall
      ansible.builtin.apt:
        name: [docker.io, docker-compose-v2, ufw, unattended-upgrades]
        update_cache: true

    # lazydocker shows every container, its logs and stats from an SSH session; Ubuntu has no package for it,
    # so the pinned release is checked against its digest. To upgrade, change lazydocker_version and the digests.
    - name: Download lazydocker
      ansible.builtin.get_url:
        url: "https://github.com/jesseduffield/lazydocker/releases/download/v{{ lazydocker_version }}/lazydocker_{{ lazydocker_version }}_Linux_{{ lazydocker_arch }}.tar.gz"
        dest: "/tmp/lazydocker-{{ lazydocker_version }}.tar.gz"
        checksum: "sha256:{{ lazydocker_sha256[lazydocker_arch] }}"
        mode: "0644"

    - name: Install lazydocker
      ansible.builtin.unarchive:
        src: "/tmp/lazydocker-{{ lazydocker_version }}.tar.gz"
        remote_src: true
        dest: /usr/local/bin
        include: [lazydocker]

    - name: Fail without the domain or deploy key
      ansible.builtin.assert:
        that: caddy_domain | length > 0 and deploy_public_key | length > 0
        fail_msg: Load secrets/<environment>/env/.env.vps with CADDY_DOMAIN and VPS_SSH_PUBLIC_KEY set.

    # SSH for Ansible and CI, 80 for the ACME challenge and redirect, 443 (TCP and QUIC) for Caddy.
    - name: Allow SSH, HTTP and HTTPS
      community.general.ufw:
        rule: allow
        port: "{{ item.port }}"
        proto: "{{ item.proto }}"
      loop:
        - { port: "22", proto: tcp }
        - { port: "80", proto: tcp }
        - { port: "443", proto: any }

    - name: Enable the firewall, denying other inbound traffic
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming

    - name: Allow SSH by key only
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config.d/10-smartledger.conf
        create: true
        mode: "0644"
        regexp: "^{{ item.split(' ')[0] }} "
        line: "{{ item }}"
      loop:
        - PasswordAuthentication no
        - KbdInteractiveAuthentication no
        - PermitRootLogin prohibit-password
      notify: Reload sshd

    # Core and AI together need more than a 2 GB VPS has at startup.
    - name: Create the swap file
      ansible.builtin.command: >-
        bash -c "fallocate -l {{ swap_size_mb }}M /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile"
      args:
        creates: /swapfile

    - name: Keep the swap file after reboot
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: /swapfile none swap sw 0 0

    - name: Create the deploy user that CI logs in as
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        groups: docker
        append: true
        shell: /bin/bash
        password: "!"

    - name: Authorize the CI deploy key
      ansible.posix.authorized_key:
        user: "{{ deploy_user }}"
        key: "{{ deploy_public_key }}"
        exclusive: true

    # Caddy and every environment's Core meet on this network; AI stays on its project's own network.
    - name: Create the edge network
      ansible.builtin.shell: docker network inspect edge >/dev/null 2>&1 || docker network create edge
      changed_when: false

    - name: Create the app directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0750"

    - name: Upload the Compose stack
      ansible.builtin.copy:
        src: "../vps/{{ item }}"
        dest: "{{ app_dir }}/{{ item }}"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0644"
      loop: [compose.yaml, bifrost.json]
      notify: Apply the stack

    - name: Upload the service env files
      ansible.builtin.copy:
        src: "{{ env_dir }}/{{ item.src }}"
        dest: "{{ app_dir }}/{{ item.dest }}"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0600"
      loop:
        - { src: .env.core, dest: core.env }
        - { src: .env.ai, dest: ai.env }
        - { src: .env.bifrost, dest: bifrost.env }
      no_log: true
      notify: Apply the stack

    # Only these lines: the deploy rewrites the image lines of the same file. ENVIRONMENT names the Compose
    # project (smart-ledger-staging, smart-ledger-production), which the app directory would otherwise name.
    - name: Name the Compose project and Core on the edge network
      ansible.builtin.lineinfile:
        path: "{{ app_dir }}/.env"
        create: true
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0600"
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
      loop:
        - { key: ENVIRONMENT, value: "{{ smartledger_env }}" }
        - { key: CORE_ALIAS, value: "core-{{ smartledger_env }}" }
      notify: Apply the stack

    - name: Create the edge directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop: ["{{ edge_dir }}", "{{ edge_dir }}/conf", "{{ edge_dir }}/sites"]

    - name: Upload the shared Caddy
      ansible.builtin.copy:
        src: "../edge/{{ item.src }}"
        dest: "{{ edge_dir }}/{{ item.dest }}"
        mode: "0644"
      loop:
        - { src: compose.yaml, dest: compose.yaml }
        - { src: Caddyfile, dest: conf/Caddyfile }
      notify: Apply the edge

    # Mounted as a single file before conf/; left in place it would look like the live config.
    - name: Remove the Caddyfile the edge no longer reads
      ansible.builtin.file:
        path: "{{ edge_dir }}/Caddyfile"
        state: absent

    - name: Route this environment's domain to its Core
      ansible.builtin.copy:
        dest: "{{ edge_dir }}/sites/{{ smartledger_env }}.caddy"
        mode: "0644"
        content: |
          {{ caddy_domain }} {
          	reverse_proxy core-{{ smartledger_env }}:8080
          }
      notify: Apply the edge

    # Only the admin UI and its API go public. Model calls stay internal to AI: the virtual key already guards them,
    # and refusing the inference prefixes here keeps a leaked key from being spent from outside.
    - name: Route this environment's gateway domain to the Bifrost admin UI
      ansible.builtin.copy:
        dest: "{{ edge_dir }}/sites/gateway-{{ smartledger_env }}.caddy"
        mode: "0644"
        content: |
          {{ gateway_domain }} {
          	@inference path /v1/* /openai/* /anthropic/* /genai/* /bedrock/* /cohere/* /litellm/* /langchain/* /pydanticai/*
          	respond @inference 404
          	reverse_proxy gateway-{{ smartledger_env }}:8080
          }
      when: gateway_domain | length > 0
      notify: Apply the edge

    - name: Create the Dopbase directory
      ansible.builtin.file:
        path: "{{ dopbase_dir }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0750"
      when: dopbase_domain | length > 0

    - name: Upload Dopbase
      ansible.builtin.copy:
        src: "../dopbase/{{ item }}"
        dest: "{{ dopbase_dir }}/{{ item }}"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0644"
      loop: [compose.yaml, Dockerfile]
      when: dopbase_domain | length > 0
      notify: Apply Dopbase

    - name: Upload the Dopbase backup script
      ansible.builtin.copy:
        src: ../dopbase/backup.sh
        dest: "{{ dopbase_dir }}/backup.sh"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0750"
      when: dopbase_domain | length > 0

    - name: Set the Dopbase public URL
      ansible.builtin.copy:
        dest: "{{ dopbase_dir }}/.env"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0600"
        content: "DOPBASE_PUBLIC_URL=https://{{ dopbase_domain }}\n"
      when: dopbase_domain | length > 0
      notify: Apply Dopbase

    - name: Route the Dopbase domain to Dopbase
      ansible.builtin.copy:
        dest: "{{ edge_dir }}/sites/dopbase.caddy"
        mode: "0644"
        content: |
          {{ dopbase_domain }} {
          	reverse_proxy dopbase:8840
          }
      when: dopbase_domain | length > 0
      notify: Apply the edge

    # age encrypts the archive before it leaves the machine and rclone uploads it; Ubuntu packages both.
    - name: Install the Dopbase backup tools
      ansible.builtin.apt:
        name: [age, rclone]
        update_cache: true
      when: dopbase_domain | length > 0 and dopbase_backup_bucket | length > 0

    - name: Set the Dopbase backup settings
      ansible.builtin.copy:
        dest: "{{ dopbase_dir }}/.env.backup"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0600"
        content: |
          DOPBASE_BACKUP_BUCKET={{ dopbase_backup_bucket }}
          DOPBASE_BACKUP_ENDPOINT={{ dopbase_backup_endpoint }}
          DOPBASE_BACKUP_RECIPIENT={{ dopbase_backup_recipient }}
          DOPBASE_BACKUP_KEY_ID={{ dopbase_backup_key_id }}
          DOPBASE_BACKUP_SECRET={{ dopbase_backup_secret }}
      when: dopbase_domain | length > 0 and dopbase_backup_bucket | length > 0
      no_log: true

    # Every environment shares one Dopbase, so the job is defined once; a second run only rewrites the same line.
    - name: Back up Dopbase every night
      ansible.builtin.cron:
        name: dopbase-backup
        user: "{{ deploy_user }}"
        minute: "0"
        hour: "{{ dopbase_backup_hour }}"
        job: "cd {{ dopbase_dir }} && ./backup.sh >>/var/log/dopbase-backup.log 2>&1"
        state: "{{ 'present' if dopbase_backup_bucket | length > 0 else 'absent' }}"
      when: dopbase_domain | length > 0

    - name: Let the deploy user write the backup log
      ansible.builtin.file:
        path: /var/log/dopbase-backup.log
        state: touch
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0640"
        modification_time: preserve
        access_time: preserve
      when: dopbase_domain | length > 0 and dopbase_backup_bucket | length > 0

    - name: Fail without the Grafana password or an alert destination
      ansible.builtin.assert:
        that:
          - grafana_admin_password | length > 0
          - monitor_discord_webhook_url | length > 0
          - monitor_telegram_bot_token | length > 0
          - monitor_telegram_chat_id | length > 0
        fail_msg: With MONITOR_DOMAIN set, .env.vps also needs GRAFANA_ADMIN_PASSWORD, MONITOR_DISCORD_WEBHOOK_URL, MONITOR_TELEGRAM_BOT_TOKEN and MONITOR_TELEGRAM_CHAT_ID.
      when: monitor_domain | length > 0

    - name: Create the monitoring directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0750"
      loop: ["{{ monitoring_dir }}", "{{ monitoring_dir }}/targets", "{{ monitoring_dir }}/targets/services"]
      when: monitor_domain | length > 0

    - name: Upload the monitoring stack
      ansible.builtin.copy:
        src: ../monitoring/
        dest: "{{ monitoring_dir }}/"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0644"
        directory_mode: "0755"
      when: monitor_domain | length > 0
      notify: Apply monitoring

    - name: Set the monitoring settings
      ansible.builtin.copy:
        dest: "{{ monitoring_dir }}/.env"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0600"
        content: |
          MONITOR_DOMAIN={{ monitor_domain }}
          GRAFANA_ADMIN_PASSWORD={{ grafana_admin_password }}
          DISCORD_WEBHOOK_URL={{ monitor_discord_webhook_url }}
          TELEGRAM_BOT_TOKEN={{ monitor_telegram_bot_token }}
          TELEGRAM_CHAT_ID={{ monitor_telegram_chat_id }}
      when: monitor_domain | length > 0
      no_log: true
      notify: Apply monitoring

    # The dashboards read only what grafana_reader is granted (ADR-0003); another login would show them every column.
    - name: Fail unless the product analytics login is the read-only role
      ansible.builtin.assert:
        that: grafana_pg_user is match('grafana_reader([.]|$)')
        fail_msg: GRAFANA_PG_USER must be the grafana_reader role (grafana_reader.<project-ref> through the pooler).
      when: monitor_domain | length > 0 and grafana_pg_host | length > 0

    # One file per environment, because .env above is rewritten by every environment's run.
    - name: Set this environment's product analytics login
      ansible.builtin.copy:
        dest: "{{ monitoring_dir }}/postgres-{{ smartledger_env }}.env"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0600"
        content: |
          SMARTLEDGER_{{ smartledger_env | upper }}_PG_URL={{ grafana_pg_host }}:{{ grafana_pg_port }}
          SMARTLEDGER_{{ smartledger_env | upper }}_PG_DATABASE={{ grafana_pg_database }}
          SMARTLEDGER_{{ smartledger_env | upper }}_PG_USER={{ grafana_pg_user }}
          SMARTLEDGER_{{ smartledger_env | upper }}_PG_PASSWORD={{ grafana_pg_password }}
      when: monitor_domain | length > 0 and grafana_pg_host | length > 0
      no_log: true
      notify: Apply monitoring

    # Alloy reloads this file by itself; each run of the playbook adds or updates only its own environment.
    # CADDY_DOMAIN may list several comma-separated names for one site; the first is probed.
    # Liveness answers while Core runs; readiness also checks Core's database connection, so it fails when Supabase does.
    # AI and Bifrost have no public URL: Alloy reaches them on the app network by container name, unique across
    # environments where the service names `ai` and `bifrost` are not.
    - name: Probe this environment's Core over HTTPS and its AI and Bifrost inside the app network
      ansible.builtin.copy:
        dest: "{{ monitoring_dir }}/targets/{{ smartledger_env }}.json"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0644"
        content: "{{ probes | to_json }}\n"
      vars:
        core_url: "https://{{ caddy_domain.split(',') | first | trim }}"
        container: "http://smart-ledger-{{ smartledger_env }}"
        probes:
          - { targets: ["{{ core_url }}/actuator/health/liveness"], labels: { env: "{{ smartledger_env }}", check: core } }
          - { targets: ["{{ core_url }}/actuator/health/readiness"], labels: { env: "{{ smartledger_env }}", check: database } }
          - { targets: ["{{ container }}-ai-1:8001/health"], labels: { env: "{{ smartledger_env }}", check: ai } }
          - { targets: ["{{ container }}-bifrost-1:8080/health"], labels: { env: "{{ smartledger_env }}", check: bifrost } }
      when: monitor_domain | length > 0

    # Services that export their own request metrics, scraped on the app network like the probes above.
    - name: Scrape this environment's AI metrics inside the app network
      ansible.builtin.copy:
        dest: "{{ monitoring_dir }}/targets/services/{{ smartledger_env }}.json"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0644"
        content: "{{ services | to_json }}\n"
      vars:
        services:
          - { targets: ["smart-ledger-{{ smartledger_env }}-ai-1:8001"], labels: { env: "{{ smartledger_env }}", service: ai } }
      when: monitor_domain | length > 0

    - name: Route the monitoring domain to Grafana
      ansible.builtin.copy:
        dest: "{{ edge_dir }}/sites/monitoring.caddy"
        mode: "0644"
        content: |
          {{ monitor_domain }} {
          	reverse_proxy grafana:3000
          }
      when: monitor_domain | length > 0
      notify: Apply the edge

    - name: Log in to GHCR with the read-only token
      ansible.builtin.command:
        cmd: docker login ghcr.io --username {{ ghcr_username }} --password-stdin
        stdin: "{{ ghcr_read_token }}"
      become: true
      become_user: "{{ deploy_user }}"
      when: ghcr_read_token | length > 0
      changed_when: false
      no_log: true

  handlers:
    - name: Reload sshd
      ansible.builtin.service:
        name: ssh
        state: reloaded

    # Before the first deploy there are no images to start; the first CD run starts the stack.
    # --remove-orphans drops the per-environment Caddy of the older layout, which held ports 80 and 443.
    - name: Apply the stack
      ansible.builtin.shell: grep -q '^CORE_IMAGE=' .env && grep -q '^AI_IMAGE=' .env && docker compose up -d --wait --remove-orphans || true
      args:
        chdir: "{{ app_dir }}"
      become: true
      become_user: "{{ deploy_user }}"
      changed_when: true

    # On first start Dopbase prints a protected setup link: read it with `docker compose logs dopbase`.
    - name: Apply Dopbase
      ansible.builtin.command: docker compose up -d --build --wait
      args:
        chdir: "{{ dopbase_dir }}"
      become: true
      become_user: "{{ deploy_user }}"
      changed_when: true

    # Runs before the edge, so Caddy finds Grafana on the edge network when it reloads the new site, and after the
    # stack, so a new environment's network exists. Alloy joins only the app networks that exist: Compose refuses to
    # start a container on a missing external network. Alloy, Loki and Grafana read their bind-mounted config only at
    # start, and Compose does not recreate a container when only a mounted file changed, so every run recreates them;
    # their data stays in named volumes.
    - name: Apply monitoring
      ansible.builtin.shell: |
        set -eu
        nets=""
        for env in staging production; do
          if docker network inspect "smart-ledger-${env}_default" >/dev/null 2>&1; then nets="$nets smart-ledger-${env}_default"; fi
        done
        {
          printf 'services:\n  alloy:\n    networks:\n      default:\n'
          for net in $nets; do printf '      %s:\n' "$net"; done
          printf 'networks:\n'
          for net in $nets; do printf '  %s:\n    external: true\n' "$net"; done
        } > compose.override.yaml
        [ -n "$nets" ] || rm compose.override.yaml
        docker compose up -d --wait --remove-orphans --force-recreate
      args:
        chdir: "{{ monitoring_dir }}"
      become: true
      become_user: "{{ deploy_user }}"
      changed_when: true

    # Runs after the stack, so the older per-environment Caddy has freed ports 80 and 443. The reload picks up
    # a changed site file in a container that was already running.
    - name: Apply the edge
      # Validate first: a config that fails stops the playbook and leaves Caddy serving the one it already runs.
      ansible.builtin.shell: >-
        docker compose up -d
        && docker compose exec -T caddy caddy validate --config /etc/caddy/conf/Caddyfile --adapter caddyfile
        && docker compose exec -T caddy caddy reload --config /etc/caddy/conf/Caddyfile --adapter caddyfile
      args:
        chdir: "{{ edge_dir }}"
      changed_when: true
