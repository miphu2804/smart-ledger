# One VPS holds every environment. Address and login come from the environment so the committed file holds no
# real address; the login is an admin with sudo, never the deploy user.
vps:
  hosts:
    smart-ledger-vps:
      ansible_host: "{{ lookup('env', 'SMARTLEDGER_VPS_HOST') }}"
      ansible_user: "{{ lookup('env', 'SMARTLEDGER_VPS_USER') }}"
