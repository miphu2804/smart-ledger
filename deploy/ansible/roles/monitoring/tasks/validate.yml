- name: Fail without the Grafana password or an alert destination
  ansible.builtin.assert:
    that:
      - monitoring_grafana_admin_password | length > 0
      - monitoring_discord_webhook_url | length > 0
      - monitoring_telegram_bot_token | length > 0
      - monitoring_telegram_chat_id | length > 0
    fail_msg: >-
      With MONITOR_DOMAIN set, .env.vps also needs GRAFANA_ADMIN_PASSWORD, MONITOR_DISCORD_WEBHOOK_URL,
      MONITOR_TELEGRAM_BOT_TOKEN and MONITOR_TELEGRAM_CHAT_ID.
  when: monitoring_domain | length > 0
