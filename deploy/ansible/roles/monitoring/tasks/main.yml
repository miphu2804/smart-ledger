- name: Run monitoring
  when: monitoring_domain | length > 0
  block:
    - name: Set up the monitoring files
      module_defaults:
        ansible.builtin.file: { owner: "{{ sl_deploy_user }}", group: "{{ sl_deploy_user }}" }
        ansible.builtin.copy: { owner: "{{ sl_deploy_user }}", group: "{{ sl_deploy_user }}" }
        ansible.builtin.template: { owner: "{{ sl_deploy_user }}", group: "{{ sl_deploy_user }}" }
      block:
        - name: Create the monitoring directories
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            mode: "0750"
          loop: ["{{ sl_monitoring_dir }}", "{{ sl_monitoring_dir }}/targets", "{{ sl_monitoring_dir }}/targets/services"]

        - name: Upload the monitoring stack
          ansible.builtin.copy:
            src: "{{ sl_deploy_src }}/monitoring/"
            dest: "{{ sl_monitoring_dir }}/"
            mode: "0644"
            directory_mode: "0755"
          notify: Apply monitoring

        - name: Set the monitoring settings
          ansible.builtin.template:
            src: env.j2
            dest: "{{ sl_monitoring_dir }}/.env"
            mode: "0600"
          no_log: true
          notify: Apply monitoring

    - name: Route the monitoring domain to Grafana
      ansible.builtin.template:
        src: monitoring.caddy.j2
        dest: "{{ sl_edge_dir }}/sites/monitoring.caddy"
        mode: "0644"
      notify: Apply the edge
