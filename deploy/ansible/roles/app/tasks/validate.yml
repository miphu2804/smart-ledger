- name: Fail without the environment's domain
  ansible.builtin.assert:
    that: app_caddy_domain | length > 0
    fail_msg: Load secrets/{{ sl_environment }}/env/.env.vps with CADDY_DOMAIN set.

- name: Fail without the env files of each environment
  ansible.builtin.stat:
    path: "{{ sl_env_dir }}/{{ item }}"
  loop: [.env.core, .env.ai, .env.bifrost]
  delegate_to: localhost
  become: false
  register: app_env_files
  failed_when: not app_env_files.stat.exists
  check_mode: false
