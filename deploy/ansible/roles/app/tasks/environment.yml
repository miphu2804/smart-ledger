- name: Create the app directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ sl_deploy_user }}"
    group: "{{ sl_deploy_user }}"
    mode: "0750"

- name: Upload this environment's stack files
  module_defaults:
    ansible.builtin.copy: { owner: "{{ sl_deploy_user }}", group: "{{ sl_deploy_user }}" }
    ansible.builtin.lineinfile: { owner: "{{ sl_deploy_user }}", group: "{{ sl_deploy_user }}" }
  block:
    - name: Upload the Compose stack
      ansible.builtin.copy:
        src: "{{ sl_deploy_src }}/vps/{{ item }}"
        dest: "{{ app_dir }}/{{ item }}"
        mode: "0644"
      loop: [compose.yaml, bifrost.json]
      notify: Apply the stack

    - name: Upload the service env files
      ansible.builtin.copy:
        src: "{{ sl_env_dir }}/{{ item.src }}"
        dest: "{{ app_dir }}/{{ item.dest }}"
        mode: "0600"
      loop:
        - { src: .env.core, dest: core.env }
        - { src: .env.ai, dest: ai.env }
        - { src: .env.bifrost, dest: bifrost.env }
      no_log: true
      notify: Apply the stack

    # Only these lines: the deploy rewrites the image lines of the same file. ENVIRONMENT names the Compose
    # project (smart-ledger-staging, smart-ledger-production), which the app directory would otherwise name.
    - name: Name the Compose project and Core on the edge network
      ansible.builtin.lineinfile:
        path: "{{ app_dir }}/.env"
        create: true
        mode: "0600"
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
      loop:
        - { key: ENVIRONMENT, value: "{{ app_env }}" }
        - { key: CORE_ALIAS, value: "core-{{ app_env }}" }
      notify: Apply the stack

- name: Route this environment's domain to its Core
  ansible.builtin.template:
    src: core.caddy.j2
    dest: "{{ sl_edge_dir }}/sites/{{ app_env }}.caddy"
    mode: "0644"
  notify: Apply the edge

# Only the admin UI and its API go public. Model calls stay internal to AI: the virtual key already guards them,
# and refusing the inference prefixes here keeps a leaked key from being spent from outside.
- name: Route this environment's gateway domain to the Bifrost admin UI
  ansible.builtin.template:
    src: gateway.caddy.j2
    dest: "{{ sl_edge_dir }}/sites/gateway-{{ app_env }}.caddy"
    mode: "0644"
  when: app_gateway_domain | length > 0
  notify: Apply the edge

# The monitoring files of this environment only: the shared .env and the backup cron belong to the other roles.
- name: Write this environment's monitoring files
  when: monitoring_domain | length > 0
  module_defaults:
    ansible.builtin.copy: { owner: "{{ sl_deploy_user }}", group: "{{ sl_deploy_user }}" }
    ansible.builtin.template: { owner: "{{ sl_deploy_user }}", group: "{{ sl_deploy_user }}" }
  block:
    # Alloy reloads this file by itself.
    # CADDY_DOMAIN may list several comma-separated names for one site; the first is probed.
    # Liveness answers while Core runs; readiness also checks Core's database connection, so it fails when Supabase does.
    # AI and Bifrost have no public URL: Alloy reaches them on the app network by container name, unique across
    # environments where the service names `ai` and `bifrost` are not.
    - name: Probe this environment's Core over HTTPS and its AI and Bifrost inside the app network
      ansible.builtin.copy:
        dest: "{{ sl_monitoring_dir }}/targets/{{ app_env }}.json"
        mode: "0644"
        content: "{{ probes | to_json }}\n"
      vars:
        core_url: "https://{{ app_caddy_domain.split(',') | first | trim }}"
        container: "http://smart-ledger-{{ app_env }}"
        probes:
          - { targets: ["{{ core_url }}/actuator/health/liveness"], labels: { env: "{{ app_env }}", check: core } }
          - { targets: ["{{ core_url }}/actuator/health/readiness"], labels: { env: "{{ app_env }}", check: database } }
          - { targets: ["{{ container }}-ai-1:8001/health"], labels: { env: "{{ app_env }}", check: ai } }
          - { targets: ["{{ container }}-bifrost-1:8080/health"], labels: { env: "{{ app_env }}", check: bifrost } }

    # Services that export their own request metrics, scraped on the app network like the probes above.
    - name: Scrape this environment's AI metrics inside the app network
      ansible.builtin.copy:
        dest: "{{ sl_monitoring_dir }}/targets/services/{{ app_env }}.json"
        mode: "0644"
        content: "{{ services | to_json }}\n"
      vars:
        services:
          - { targets: ["smart-ledger-{{ app_env }}-ai-1:8001"], labels: { env: "{{ app_env }}", service: ai } }
