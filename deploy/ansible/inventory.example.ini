# Copy to inventory.ini (ignored by Git) and fill in each VPS. ansible_user is an admin login with
# sudo, not the deploy user. deploy_public_key_file is the public half of the key stored as
# VPS_SSH_KEY in the matching GitHub environment.
[staging]
smartledger-staging ansible_host=203.0.113.10

[staging:vars]
smartledger_env=staging

[production]
smartledger-production ansible_host=203.0.113.20

[production:vars]
smartledger_env=production

[all:vars]
ansible_user=root
deploy_public_key_file=~/.ssh/smartledger_deploy.pub
