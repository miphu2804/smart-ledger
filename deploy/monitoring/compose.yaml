# Monitoring shared by every environment on the VPS: Alloy collects host, container and probe metrics plus container
# logs, Prometheus and Loki store them, and Grafana shows them and sends alerts to Discord. Lives in
# /opt/smart-ledger-monitoring next to these files; deploy/ansible/playbook.yml writes .env and targets/<environment>.json.
# Each container has a memory limit so the stack stays under about 1 GB and cannot starve Core or AI on the 4 GB VPS.
# See docs/development/ci-cd.md#monitoring.

name: smart-ledger-monitoring

services:
  alloy:
    image: grafana/alloy:v1.15.0
    command: [run, /etc/alloy/config.alloy, --storage.path=/var/lib/alloy/data]
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - ./targets:/etc/alloy/targets:ro
      - alloy_data:/var/lib/alloy/data
      # Container metrics (cAdvisor) and logs read the Docker socket and cgroups; host metrics read /proc and /sys.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Docker 29 keeps image layers in containerd's snapshotter, which cAdvisor asks for each container's layer.
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /:/host/root:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    # cAdvisor needs both to read every container's cgroup: with cgroup v2 a private cgroup namespace shows only
    # Alloy's own.
    privileged: true
    cgroup: host
    mem_limit: 256m
    depends_on: [prometheus, loki]
    restart: unless-stopped
    logging: &logging
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v3.5.0
    # Alloy pushes every sample, so the image's default config (scraping itself) is enough.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-remote-write-receiver
    volumes:
      - prometheus_data:/prometheus
    mem_limit: 192m
    restart: unless-stopped
    logging: *logging

  loki:
    image: grafana/loki:3.5.3
    command: [-config.file=/etc/loki/loki.yaml]
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    mem_limit: 256m
    restart: unless-stopped
    logging: *logging

  grafana:
    image: grafana/grafana:12.1.1
    env_file: .env
    environment:
      GF_SERVER_ROOT_URL: https://${MONITOR_DOMAIN:?MONITOR_DOMAIN is required}
      # Applies on the first start only; later changes go through the Grafana UI or `grafana cli admin reset-admin-password`.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    mem_limit: 256m
    depends_on: [prometheus, loki]
    networks:
      default:
      edge:
        aliases: [grafana]
    # Same wildcard-DNS guard as Caddy and Core: an unresolved name must not reach an outside host.
    dns_search: .
    restart: unless-stopped
    logging: *logging

networks:
  edge:
    external: true

volumes:
  alloy_data:
  prometheus_data:
  loki_data:
  grafana_data:
