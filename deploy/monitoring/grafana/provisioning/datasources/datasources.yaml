apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
  # Product analytics (ADR-0003): each environment's Supabase through its session pooler as the read-only
  # grafana_reader role. The playbook writes the variables to postgres-<environment>.env; an environment without them
  # keeps an empty datasource whose panels say the connection failed. maxIdleConns 0 closes the connection after
  # every query, so Grafana holds a pooler slot only while a panel refreshes.
  - name: SmartLedger staging
    uid: smartledger-staging-pg
    type: grafana-postgresql-datasource
    access: proxy
    url: $SMARTLEDGER_STAGING_PG_URL
    user: $SMARTLEDGER_STAGING_PG_USER
    editable: false
    jsonData:
      database: $SMARTLEDGER_STAGING_PG_DATABASE
      sslmode: require
      postgresVersion: 1500
      maxOpenConns: 1
      maxIdleConns: 0
      connMaxLifetime: 300
    secureJsonData:
      password: $SMARTLEDGER_STAGING_PG_PASSWORD
  - name: SmartLedger production
    uid: smartledger-production-pg
    type: grafana-postgresql-datasource
    access: proxy
    url: $SMARTLEDGER_PRODUCTION_PG_URL
    user: $SMARTLEDGER_PRODUCTION_PG_USER
    editable: false
    jsonData:
      database: $SMARTLEDGER_PRODUCTION_PG_DATABASE
      sslmode: require
      postgresVersion: 1500
      maxOpenConns: 1
      maxIdleConns: 0
      connMaxLifetime: 300
    secureJsonData:
      password: $SMARTLEDGER_PRODUCTION_PG_PASSWORD
