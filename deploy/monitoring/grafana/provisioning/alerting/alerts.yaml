# The minimal alert set for one small VPS, sent to Discord and Telegram. Each query returns a series only while something is wrong,
# with a positive value, so the threshold B fires on it and no data means healthy.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: smartledger
    receivers:
      # Discord through its webhook API, so the payload in templates.yaml can build an embed with fields.
      - uid: discord-webhook
        type: webhook
        settings:
          url: $DISCORD_WEBHOOK_URL
          httpMethod: POST
          payload:
            template: '{{ template "smartledger.discord.payload" . }}'
      # Telegram through the Bot API too: Grafana turns a chat ID read alone from the environment into a number and
      # rejects it, while inside the URL it stays text. The Bot API reads chat_id from the query and the rest from the body.
      - uid: telegram-webhook
        type: webhook
        settings:
          url: https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage?chat_id=$TELEGRAM_CHAT_ID
          httpMethod: POST
          payload:
            template: '{{ template "smartledger.telegram.payload" . }}'

# The contact point used to be named discord with this uid; deleting it lets the new one take over the policy.
deleteContactPoints:
  - orgId: 1
    uid: discord

policies:
  - orgId: 1
    receiver: smartledger
    group_by: [alertname, env]
    repeat_interval: 4h

groups:
  - orgId: 1
    name: infra
    folder: Infra
    interval: 1m
    rules:
      - uid: endpoint-down
        title: Endpoint down
        condition: B
        for: 2m
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: '1 - probe_success{check="core"} > 0' }
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [0] } }]
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations: { summary: "{{ $labels.env }} Core health over HTTPS fails: DNS, Caddy, certificate or Core is down" }

      # Readiness fails while Core is up only when its database check fails; Endpoint down covers Core itself.
      - uid: database-down
        title: Database down
        condition: B
        for: 2m
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: '(1 - probe_success{check="database"}) > 0 and on(env) probe_success{check="core"} == 1' }
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [0] } }]
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations: { summary: "{{ $labels.env }} Core cannot reach its database: Supabase, the pooler or its connection limit" }

      # AI and Bifrost have no public URL; Alloy probes them on their app network.
      - uid: service-down
        title: Service down
        condition: B
        for: 2m
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: '1 - probe_success{check=~"ai|bifrost"} > 0' }
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [0] } }]
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations: { summary: "{{ $labels.env }} {{ $labels.check }} health fails inside its network: the container is stopped, starting or unhealthy" }

      - uid: container-restarting
        title: Container restarting
        condition: B
        for: 0s
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: 'changes(container_start_time_seconds{name!=""}[15m]) > 3' }
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [0] } }]
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.name }} restarted more than 3 times in 15 minutes: crash loop or memory limit" }

      - uid: host-memory
        title: Host memory high
        condition: B
        for: 5m
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: "(1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90" }
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [0] } }]
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations: { summary: "VPS memory above 90% for 5 minutes; staging and production share it" }

      - uid: host-disk
        title: Host disk high
        condition: B
        for: 10m
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: '(1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 > 85' }
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [0] } }]
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations: { summary: "VPS root disk above 85%" }

      - uid: cert-expiring
        title: Certificate expiring
        condition: B
        for: 1h
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: '(probe_ssl_earliest_cert_expiry{check="core"} - time()) / 86400 < 14' }
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [-1000] } }]
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.env }} certificate expires in under 14 days: Caddy renewal is failing" }
