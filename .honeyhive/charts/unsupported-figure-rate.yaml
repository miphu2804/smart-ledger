name: Unsupported figure rate
description: Share of chat turns answering with a figure no tool or question supports, scored by the unsupported-figure evaluator, by source.
metric: metrics.unsupported-figure
func: avg
groupBy: source
bucketing: day
dateRange:
  relative: 30d
# HoneyHive charts session metrics only under an event_type filter; filtered on
# event_name it looks for the metric on child events and finds none.
query:
  - field: event_type
    operator: is
    value: session
    type: string
