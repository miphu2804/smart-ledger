name: Tool calls per turn
description: Average tool calls per chat turn, by source; a rise means the agent retries queries or loops.
metric: metrics.tool_calls
func: avg
groupBy: source
bucketing: day
dateRange:
  relative: 30d
# HoneyHive charts session metrics only under an event_type filter; filtered on
# event_name it looks for the metric on child events and finds none.
query:
  - field: event_type
    operator: is
    value: session
    type: string
