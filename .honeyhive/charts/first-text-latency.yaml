name: First words wait p50
description: Median wait from a streamed chat turn's arrival to the first words the owner sees, by source.
metric: metrics.first_text_ms
func: median
groupBy: source
bucketing: day
dateRange:
  relative: 30d
# HoneyHive charts session metrics only under an event_type filter; filtered on
# event_name it looks for the metric on child events and finds none.
query:
  - field: event_type
    operator: is
    value: session
    type: string
