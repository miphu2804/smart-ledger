name: format-violation
type: PYTHON
return_type: boolean
description: True when the answer uses Markdown the shop agent prompt forbids, such as bullet lists, headings, quotes or a code block other than chart, so the app shows it unlike the rest of the chat.
enabled_in_prod: true
sampling_percentage: 100
filters:
  filterArray:
    - field: event_type
      operator: is
      value: session
      type: string
    - field: event_name
      operator: is
      value: agent-chat
      type: string
criteria: |
  import re

  # Rule 10 of SHOP_AGENT_SYSTEM_PROMPT allows only **bold**, numbered lists, small
  # tables and the chart block; the service itself appends the ```actions block.
  ALLOWED_BLOCK = re.compile(r"^[ \t]*```(chart|actions)[ \t]*\n.*?^[ \t]*```[ \t]*$", re.DOTALL | re.MULTILINE)
  FORBIDDEN = re.compile(r"^[ \t]*([-•*+][ \t]|#{1,6}[ \t]|>[ \t]?)|```", re.MULTILINE)

  answer = ALLOWED_BLOCK.sub("", outputs.get("answer") or "")
  result = bool(FORBIDDEN.search(answer))
