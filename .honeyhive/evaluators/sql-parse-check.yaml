name: sql-parse-check
type: PYTHON
return_type: boolean
description: True when the SQL the model sent to query_shop_data parses as PostgreSQL, by HoneyHive's SQL Parse Check template; False means the query had a syntax error before the guard or the database saw it.
enabled_in_prod: true
sampling_percentage: 100
filters:
  filterArray:
    - field: event_type
      operator: is
      value: tool
      type: string
    - field: event_name
      operator: is
      value: execute_tool query_shop_data
      type: string
criteria: |
  import json

  import sqlglot

  # Pydantic AI records the call's arguments under `tool_arguments`, a mapping on the
  # events seen so far; a JSON string is read too. The tool takes one argument, `sql`.
  # Anything unreadable counts as unparsable rather than raising, because an evaluator
  # that errors too often is switched off.
  try:
      arguments = (inputs or {}).get("tool_arguments") or {}
      if isinstance(arguments, str):
          arguments = json.loads(arguments)
      sqlglot.parse_one(arguments.get("sql") or "", dialect="postgres")
      result = True
  except Exception:
      result = False
