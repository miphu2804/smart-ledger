# ruff-check --fix covers isort (rule I). ruff-format is Black-compatible.
# Do not add Black or isort hooks alongside Ruff.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.0
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/ai/
      - id: ruff-format
        files: ^backend/ai/
