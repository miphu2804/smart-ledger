# ruff-check --fix covers isort (rule I). ruff-format is Black-compatible.
# Do not add Black or isort hooks alongside Ruff.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.0
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/ai/
      - id: ruff-format
        files: ^backend/ai/
  - repo: local
    hooks:
      - id: secrets-guard
        name: refuse decrypted secrets
        entry: scripts/secrets/guard.sh
        language: script
        files: ^secrets/
        pass_filenames: false
      - id: secrets-pull
        name: pull and decrypt secrets
        entry: scripts/secrets/pull.sh
        language: script
        stages: [post-merge, post-checkout]
        always_run: true
        pass_filenames: false
